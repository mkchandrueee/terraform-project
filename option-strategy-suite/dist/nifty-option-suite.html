<style>
/* ==========================================================================
   NIFTY Option Strategy Suite — stylesheet
   Dark trading-terminal theme, mobile first.
   ========================================================================== */

:root {
  --bg:            #0a1017;
  --bg-elev:       #111a24;
  --bg-elev-2:     #16222e;
  --line:          #223141;
  --line-soft:     #1a2734;
  --text:          #e6edf3;
  --text-dim:      #93a4b5;
  --text-faint:    #6b7d8f;

  --accent:        #37d6a0;
  --accent-dark:   #1f9d73;
  --call:          #37d6a0;
  --put:           #ff6b81;
  --warn:          #ffb454;
  --danger:        #ff5f6d;
  --info:          #58a6ff;

  --radius:        14px;
  --radius-sm:     9px;
  --shadow:        0 10px 30px rgba(0, 0, 0, .35);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

/* An author `display` rule outranks the UA stylesheet's [hidden]{display:none},
   so anything given display:flex/grid would still paint while hidden. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 520px at 12% -8%, #14283a 0%, transparent 60%),
    radial-gradient(900px 480px at 92% 0%, #172a24 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }

h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }

.muted { color: var(--text-dim); }
.small { font-size: 13px; }
em { font-style: normal; color: var(--text-faint); font-weight: 400; }

/* ---------- header ---------- */
.app-header {
  border-bottom: 1px solid var(--line-soft);
  background: rgba(10, 16, 23, .82);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 30;
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark { display: flex; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text strong { font-size: 16px; letter-spacing: -.015em; }
.brand-text small { color: var(--text-faint); font-size: 12px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
  font: inherit; font-weight: 600; font-size: 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--line);
  padding: 9px 16px; cursor: pointer;
  background: var(--bg-elev-2); color: var(--text);
  transition: background .15s ease, border-color .15s ease, transform .05s ease;
}
.btn:hover { background: #1d2c3a; border-color: #2e4155; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.btn-primary {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
  border-color: transparent; color: #06231a;
}
.btn-primary:hover { filter: brightness(1.07); background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.lang-toggle { min-width: 74px; border-color: #2e4155; }

/* ---------- settings drawer ---------- */
.drawer {
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg-elev);
  padding: 20px 0 24px;
}
.drawer-title { font-size: 17px; margin-bottom: 6px; }
.settings-grid {
  display: grid; gap: 14px; margin: 16px 0 4px;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
}
.settings-group {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px 14px; margin: 0; background: var(--bg-elev-2);
}
.settings-group legend { padding: 0 6px; font-size: 13px; font-weight: 650; color: var(--accent); }
.settings-group .field { margin-bottom: 10px; }
.settings-group .field:last-child { margin-bottom: 0; }
.save-flash { color: var(--accent); font-size: 13px; align-self: center; }

/* ---------- tabs ---------- */
.tabs { border-bottom: 1px solid var(--line-soft); background: rgba(10, 16, 23, .6); position: sticky; top: 57px; z-index: 20; }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs-inner::-webkit-scrollbar { display: none; }
.tab {
  font: inherit; font-weight: 600; font-size: 14px; white-space: nowrap;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--text-dim); padding: 12px 14px 10px; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
}
.tab:hover { color: var(--text); }
.tab.is-active { color: var(--text); border-bottom-color: var(--accent); }
.tab-step { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
.tab.is-active .tab-step { color: var(--accent); }

/* ---------- layout ---------- */
main { padding: 22px 16px 44px; }
.panel { display: none; }
.panel.is-active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-head { margin-bottom: 14px; }
.card-head h2 { font-size: 16px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.card-head h3 { font-size: 15px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.card-head p { margin-top: 5px; font-size: 13px; }

.step-pill {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  background: #1c3b32; color: var(--accent);
  border-radius: 999px; padding: 3px 9px;
}

/* ---------- fields ---------- */
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12.5px; color: var(--text-dim); font-weight: 550; }
.field input, .field select {
  font: inherit; font-family: var(--mono); font-size: 15px;
  background: #0c141d; color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; width: 100%;
}
.field select { font-family: var(--sans); font-size: 13.5px; }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(55, 214, 160, .14); }
.field input::placeholder { color: #405366; }
.field input.is-invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255, 95, 109, .13); }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.ohlc { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ohlc-3 { grid-template-columns: 1fr; }
@media (min-width: 620px) {
  .ohlc { grid-template-columns: repeat(4, 1fr); }
  .ohlc-3 { grid-template-columns: repeat(3, 1fr); }
}

.err { color: var(--danger); font-size: 12.5px; margin: 8px 0 0; min-height: 0; }
.err:empty { display: none; }

.row-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- ATM ---------- */
.atm-row { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: end; }
@media (min-width: 700px) { .atm-row { grid-template-columns: 260px 1fr; } }
.atm-result {
  border: 1px dashed var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; background: #0c141d; min-height: 56px;
  display: flex; align-items: center;
}
.atm-strike { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); }
.atm-legs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.leg { font-family: var(--mono); font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
.leg-call { color: var(--call); border-color: rgba(55, 214, 160, .4); }
.leg-put  { color: var(--put);  border-color: rgba(255, 107, 129, .4); }

/* ---------- candle input boxes ---------- */
.candle-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .candle-grid { grid-template-columns: 1fr 1fr; } }
.candle-box {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px 14px; margin: 0; background: var(--bg-elev-2);
}
.candle-box legend { font-size: 13px; font-weight: 650; padding: 0 6px; display: flex; align-items: center; gap: 7px; }
.side-call legend { color: var(--call); }
.side-put  legend { color: var(--put); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-call { background: var(--call); }
.dot-put  { background: var(--put); }

/* ---------- analyser results ---------- */
.result-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .result-grid { grid-template-columns: 1fr 1fr; } }

.result-card { border-top: 3px solid var(--line); }
.result-card.side-call { border-top-color: var(--call); }
.result-card.side-put  { border-top-color: var(--put); }
.result-title { font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.result-title .badge-primary { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; background: #1c3b32; color: var(--accent); border-radius: 999px; padding: 3px 9px; }

.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.level {
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;
}
.level-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
.level-value { font-family: var(--mono); font-size: 19px; font-weight: 700; margin-top: 3px; }
.level-entry  .level-value { color: var(--info); }
.level-target .level-value { color: var(--accent); }
.level-sl     .level-value { color: var(--danger); }

.metrics { margin-top: 13px; display: grid; gap: 6px; }
.metric { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; border-bottom: 1px dashed var(--line-soft); padding-bottom: 5px; }
.metric:last-child { border-bottom: 0; }
.metric span:first-child { color: var(--text-dim); }
.metric span:last-child { font-family: var(--mono); }

.bar { height: 6px; border-radius: 999px; background: #0c141d; border: 1px solid var(--line); overflow: hidden; margin-top: 9px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-dark), var(--accent)); }
.bar-put > i { background: linear-gradient(90deg, #b8394c, var(--put)); }

.confirm-line {
  margin-top: 13px; font-size: 13px; background: #0c141d;
  border: 1px solid var(--line); border-left: 3px solid var(--info);
  border-radius: var(--radius-sm); padding: 9px 12px;
}
.confirm-line b { font-family: var(--mono); color: var(--info); }

.bias-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bias-tag { font-size: 13px; font-weight: 650; padding: 6px 13px; border-radius: 999px; }
.bias-call { background: rgba(55, 214, 160, .13); color: var(--call); }
.bias-put  { background: rgba(255, 107, 129, .13); color: var(--put); }
.bias-flat { background: rgba(147, 164, 181, .13); color: var(--text-dim); }

.note-card { border-left: 3px solid var(--info); }
.note-card h3 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.warn-card { border-left: 3px solid var(--warn); background: #1a1a12; }
.warn-card h3 { font-size: 15px; margin-bottom: 8px; color: var(--warn); }

/* ---------- T1 helper ---------- */
.t1-hero { text-align: center; padding: 26px 18px; }
.hero-badge {
  display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--warn);
  border: 1px solid rgba(255, 180, 84, .4); border-radius: 999px; padding: 5px 14px;
}
.t1-hero h2 { font-size: 24px; margin: 14px 0 8px; letter-spacing: -.02em; }
.t1-hero p { max-width: 560px; margin: 0 auto; font-size: 13.5px; }

.side-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.side-btn {
  font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--line); background: #0c141d; color: var(--text-dim);
  padding: 15px 12px; border-radius: var(--radius-sm); cursor: pointer;
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.side-btn:hover { color: var(--text); border-color: #33475c; }
.side-btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.side-btn[data-side="call"].is-active {
  color: var(--call); border-color: rgba(55, 214, 160, .55); background: rgba(55, 214, 160, .08);
  box-shadow: 0 0 0 1px rgba(55, 214, 160, .25), 0 0 22px rgba(55, 214, 160, .12);
}
.side-btn[data-side="put"].is-active {
  color: var(--put); border-color: rgba(255, 107, 129, .55); background: rgba(255, 107, 129, .08);
  box-shadow: 0 0 0 1px rgba(255, 107, 129, .25), 0 0 22px rgba(255, 107, 129, .12);
}

.btn-decide { width: 100%; padding: 15px 20px; font-size: 15.5px; letter-spacing: .02em; }
@media (min-width: 620px) { .btn-decide { width: auto; } }

/* candle preview */
.candle-preview {
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  margin-top: 16px; padding: 14px 16px;
  background: #0c141d; border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.candle-svg { flex: none; overflow: visible; }
.candle-facts { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.candle-stat { display: flex; flex-direction: column; gap: 2px; }
.candle-stat span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
.candle-stat b { font-family: var(--mono); font-size: 15px; }
.candle-dir { font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
.candle-dir.is-bull { color: var(--call); }
.candle-dir.is-bear { color: var(--put); }

/* signal strength */
.signal { display: grid; gap: 16px; }
.signal-num { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; margin-bottom: 7px; }
.signal-num span { color: var(--text-dim); }
.signal-num b { font-family: var(--mono); }

/* action plan */
.action-plan { margin: 0; padding-left: 22px; display: grid; gap: 10px; font-size: 14px; }
.action-plan li { padding-left: 4px; }
.action-plan li::marker { color: var(--accent); font-weight: 700; font-family: var(--mono); }

.mapping-note { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 14px; }
.map-item b { color: var(--text); font-weight: 650; }
.map-arrow { color: var(--text-faint); }

.verdict-card { text-align: center; padding: 24px 18px; }
.verdict-badge { display: inline-block; font-size: 22px; font-weight: 750; letter-spacing: -.01em; padding: 12px 26px; border-radius: var(--radius); }
.v-hold    { background: rgba(55, 214, 160, .13); color: var(--accent); border: 1px solid rgba(55, 214, 160, .35); }
.v-partial { background: rgba(255, 180, 84, .12); color: var(--warn);   border: 1px solid rgba(255, 180, 84, .35); }
.v-book    { background: rgba(255, 95, 109, .12);  color: var(--danger); border: 1px solid rgba(255, 95, 109, .35); }
.v-wait    { background: rgba(88, 166, 255, .10);  color: var(--info);   border: 1px solid rgba(88, 166, 255, .35); }
.verdict-sub { margin-top: 12px; font-size: 14px; color: var(--text-dim); max-width: 620px; margin-left: auto; margin-right: auto; }
.score-wrap { max-width: 380px; margin: 18px auto 0; }
.score-num { font-family: var(--mono); font-size: 15px; display: flex; justify-content: space-between; color: var(--text-dim); }
.score-num b { color: var(--text); }

.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.check {
  display: flex; gap: 11px; align-items: flex-start;
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 11px 13px;
}
.check.is-critical { border-color: rgba(88, 166, 255, .45); box-shadow: inset 3px 0 0 var(--info); }
.check-icon { font-family: var(--mono); font-weight: 700; font-size: 15px; line-height: 1.45; }
.check.pass .check-icon { color: var(--accent); }
.check.warn .check-icon { color: var(--warn); }
.check.fail .check-icon { color: var(--danger); }
.check-body { min-width: 0; flex: 1; display: block; }
.check-name { display: block; font-size: 13.5px; font-weight: 650; }
.check-name .crit-tag { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; background: rgba(88,166,255,.16); color: var(--info); border-radius: 999px; padding: 2px 8px; margin-left: 8px; vertical-align: 1px; }
.check-detail { display: block; font-size: 12.5px; color: var(--text-dim); font-family: var(--mono); margin-top: 3px; }
.check-verdict { flex: none; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; align-self: center; }
.check.pass .check-verdict { color: var(--accent); }
.check.warn .check-verdict { color: var(--warn); }
.check.fail .check-verdict { color: var(--danger); }

.gate { text-align: center; padding: 20px 18px; border-left: 3px solid var(--line); }
.gate.pass { border-left-color: var(--accent); }
.gate.fail { border-left-color: var(--danger); }
.gate h3 { font-size: 17px; margin-bottom: 6px; }
.gate.pass h3 { color: var(--accent); }
.gate.fail h3 { color: var(--danger); }

/* ---------- pullback ---------- */
.pb-side { font-size: 26px; font-weight: 750; letter-spacing: -.02em; padding: 14px 30px; border-radius: var(--radius); display: inline-block; }
.pb-call { background: rgba(55, 214, 160, .13); color: var(--call); border: 1px solid rgba(55, 214, 160, .35); }
.pb-put  { background: rgba(255, 107, 129, .12); color: var(--put); border: 1px solid rgba(255, 107, 129, .35); }
.zone-grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .zone-grid { grid-template-columns: repeat(3, 1fr); } }
.zone {
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 13px; text-align: center;
}
.zone-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--text-faint); }
.zone-value { font-family: var(--mono); font-size: 21px; font-weight: 700; margin-top: 3px; }
.zone-note { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
.zone-1 .zone-value { color: var(--info); }
.zone-2 .zone-value { color: var(--text-dim); }
.zone-t .zone-value { color: var(--accent); }
.no-sl { margin-top: 14px; text-align: center; font-size: 13px; color: var(--warn); font-weight: 650; }

.compare { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare th, .compare td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); font-family: var(--mono); }
.compare th:first-child, .compare td:first-child { text-align: left; font-family: var(--sans); color: var(--text-dim); }
.compare thead th { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-family: var(--sans); }
.compare .win { color: var(--accent); font-weight: 700; }
.table-scroll { overflow-x: auto; }

/* ---------- guide ---------- */
.guide .phase { font-size: 14px; color: var(--accent); margin: 22px 0 8px; letter-spacing: .01em; }
.guide .phase:first-child { margin-top: 0; }
.sop { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.sop li b { font-weight: 650; }
.sop li i { color: var(--info); font-style: normal; }
.inline-warn { color: var(--warn); font-weight: 650; }
.formula-list { display: grid; gap: 10px; margin-top: 12px; }
.formula {
  background: #0c141d; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 13px;
}
.formula h4 { font-size: 13px; margin: 0 0 6px; font-weight: 650; }
.formula code { font-family: var(--mono); font-size: 12.5px; color: var(--accent); display: block; white-space: pre-wrap; word-break: break-word; }
.formula p { font-size: 12.5px; color: var(--text-dim); margin: 6px 0 0; }

/* ---------- footer ---------- */
.app-footer { border-top: 1px solid var(--line-soft); padding: 20px 0 34px; font-size: 12.5px; color: var(--text-dim); }
.app-footer strong { color: var(--warn); }

@media (max-width: 700px) {
  /* the header wraps to two rows here, so stacked sticky bars would overlap */
  .app-header, .tabs { position: static; }
}

@media (max-width: 560px) {
  .levels { grid-template-columns: 1fr; }
  .verdict-badge { font-size: 18px; padding: 11px 18px; }
  .pb-side { font-size: 21px; padding: 12px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- trade signal ---------- */
.tile-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) { .tile-grid { grid-template-columns: repeat(4, 1fr); } }
.metric-tile {
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 14px 12px; text-align: center;
}
.tile-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--text-faint); }
.tile-value { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 4px; }
.tile-primary { border-color: rgba(88, 166, 255, .4); }
.tile-primary .tile-value { color: var(--info); }
.tile-good .tile-value { color: var(--accent); }
.tile-bad .tile-value { color: var(--danger); }

.edge-note { margin-top: 14px; font-size: 13.5px; text-align: center; font-weight: 600; }
.edge-note.is-good { color: var(--accent); }
.edge-note.is-bad { color: var(--danger); }

.check.skip { opacity: .62; }
.check.skip .check-icon { color: var(--text-faint); }
.check.skip .check-verdict { color: var(--text-faint); }
.weight-tag {
  font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  background: #16222e; color: var(--text-faint);
  border-radius: 999px; padding: 2px 7px; margin-left: 8px; vertical-align: 1px;
}

.metrics-table td:first-child { white-space: normal; }
.metrics-table td:last-child { text-align: right; white-space: nowrap; }
.metrics-table .pos { color: var(--accent); font-weight: 700; }
.metrics-table .neg { color: var(--danger); font-weight: 700; }

/* ---------- alerts ---------- */
.perm {
  font-size: 13px; border-radius: var(--radius-sm);
  padding: 10px 13px; border: 1px solid var(--line); background: #0c141d;
  border-left-width: 3px;
}
.perm-granted { border-left-color: var(--accent); color: var(--accent); }
.perm-default { border-left-color: var(--info); color: var(--text-dim); }
.perm-denied, .perm-unsupported { border-left-color: var(--warn); color: var(--warn); }

.checkline { display: flex; align-items: center; gap: 9px; font-size: 13.5px; margin-top: 14px; color: var(--text-dim); cursor: pointer; }
.checkline input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }

.reminder-row { display: grid; gap: 12px; margin-top: 16px; align-items: end; grid-template-columns: 1fr; }
@media (min-width: 620px) { .reminder-row { grid-template-columns: 260px 1fr; } }
.reminder-row .row-actions { margin-top: 0; }

.log-title { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); margin: 22px 0 10px; }
.alert-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.log-item {
  display: flex; gap: 12px; align-items: flex-start; font-size: 13px;
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.log-time { font-family: var(--mono); color: var(--info); flex: none; }
.log-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.log-body span { color: var(--text-dim); font-family: var(--mono); font-size: 12.5px; }
.log-empty { padding: 10px 2px; }

/* ---------- auto-fetch ---------- */
.af-card { border-left: 3px solid var(--info); }
.af-row { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: end; }
@media (min-width: 820px) { .af-row { grid-template-columns: 280px 1fr; } }
.af-row .row-actions { margin-top: 0; }
.af-status {
  margin-top: 14px; font-size: 13px; padding: 10px 13px;
  border: 1px solid var(--line); border-left-width: 3px;
  border-radius: var(--radius-sm); background: #0c141d;
}
.af-idle  { border-left-color: var(--line); color: var(--text-dim); }
.af-busy  { border-left-color: var(--info); color: var(--info); }
.af-armed { border-left-color: var(--warn); color: var(--warn); }
.af-ok    { border-left-color: var(--accent); color: var(--accent); }
.af-err   { border-left-color: var(--danger); color: var(--danger); }
.af-note { margin-top: 12px; }
.af-note code {
  font-family: var(--mono); font-size: 12px;
  background: #0c141d; border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 5px; color: var(--accent);
}

.ladder-reading {
  margin-top: 14px; padding: 11px 14px;
  background: #0c141d; border: 1px solid var(--line);
  border-left: 3px solid var(--info); border-radius: var(--radius-sm);
  display: flex; flex-direction: column; gap: 4px;
}
.ladder-reading b { font-family: var(--mono); font-size: 13.5px; color: var(--text); font-weight: 700; }
.ladder-reading span { font-size: 12.5px; color: var(--text-dim); }
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="#12202b"/><path d="M6 21l6-7 5 4 9-11" stroke="#37d6a0" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app.name">NIFTY Option Strategy Suite</strong>
        <small data-i18n="app.tagline">First-candle SOP · Analyser → T1 Helper → Pullback Entry</small>
      </span>

    <div class="header-actions">

      <button type="button" class="btn btn-ghost" id="btn-clear-all" data-i18n="app.clearAll">Clear all</button>
    </div>
  </div>
</header>

<!-- ============ Formula settings drawer ============ -->
<section id="settings-drawer" class="drawer" hidden>
  <div class="wrap">
    <h2 class="drawer-title" data-i18n="cfg.title">Formula settings</h2>
    <p class="muted small" data-i18n="cfg.intro"></p>

    <div class="settings-grid">
      <fieldset class="settings-group">
        <legend data-i18n="cfg.g1">Option Analyser</legend>
        <label class="field">
          <span><span data-i18n="cfg.entryBufferPct"></span> <em data-i18n="cfg.entryBufferPct.hint"></em></span>
          <input type="number" id="cfg-entryBufferPct" step="0.1" min="0" max="50" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.slBufferPct"></span> <em data-i18n="cfg.slBufferPct.hint"></em></span>
          <input type="number" id="cfg-slBufferPct" step="0.1" min="0" max="50" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.t1Multiplier"></span> <em data-i18n="cfg.t1Multiplier.hint"></em></span>
          <input type="number" id="cfg-t1Multiplier" step="0.05" min="0.1" max="10" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.tickSize"></span> <em data-i18n="cfg.tickSize.hint"></em></span>
          <input type="number" id="cfg-tickSize" step="0.05" min="0.01" max="10" />
        </label>
      </fieldset>

      <fieldset class="settings-group">
        <legend data-i18n="cfg.g2">T1 Decision Helper</legend>
        <label class="field">
          <span><span data-i18n="cfg.bodyStrong"></span> <em data-i18n="cfg.bodyStrong.hint"></em></span>
          <input type="number" id="cfg-bodyStrong" step="0.05" min="0" max="1" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.bodyModerate"></span> <em data-i18n="cfg.bodyModerate.hint"></em></span>
          <input type="number" id="cfg-bodyModerate" step="0.05" min="0" max="1" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.minClosePos"></span> <em data-i18n="cfg.minClosePos.hint"></em></span>
          <input type="number" id="cfg-minClosePos" step="0.05" min="0" max="1" />
        </label>
        <label class="field">
          <span data-i18n="cfg.holdThreshold">Hold-T2 momentum threshold</span>
          <input type="number" id="cfg-holdThreshold" step="1" min="0" max="100" />
        </label>
        <label class="field">
          <span data-i18n="cfg.partialThreshold">Partial-book momentum threshold</span>
          <input type="number" id="cfg-partialThreshold" step="1" min="0" max="100" />
        </label>
        <label class="field">
          <span data-i18n="cfg.sideAwareDirection">Direction convention</span>
          <select id="cfg-sideAwareDirection">
            <option value="0" data-i18n="cfg.dir.premium"></option>
            <option value="1" data-i18n="cfg.dir.inverted"></option>
          </select>
        </label>
        <p class="muted small" style="margin-top:8px" data-i18n="cfg.dirNote"></p>
      </fieldset>

      <fieldset class="settings-group">
        <legend data-i18n="cfg.g4">Trade Signal — filters</legend>
        <label class="field"><span><span data-i18n="cfg.rsiMin"></span></span><input type="number" id="cfg-rsiMin" step="1" min="0" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.rsiMax"></span></span><input type="number" id="cfg-rsiMax" step="1" min="0" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.volumeMin"></span></span><input type="number" id="cfg-volumeMin" step="0.05" min="0" max="10" /></label>
        <label class="field"><span><span data-i18n="cfg.vixMax"></span></span><input type="number" id="cfg-vixMax" step="1" min="1" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.atrReachMax"></span></span><input type="number" id="cfg-atrReachMax" step="0.1" min="0.1" max="20" /></label>
        <label class="field"><span><span data-i18n="cfg.minRR"></span></span><input type="number" id="cfg-minRR" step="0.1" min="0.1" max="20" /></label>
        <label class="field"><span><span data-i18n="cfg.takeThreshold"></span></span><input type="number" id="cfg-takeThreshold" step="1" min="0" max="100" /></label>
      </fieldset>

      <fieldset class="settings-group">
        <legend data-i18n="cfg.g5">Trade Signal — money</legend>
        <label class="field"><span><span data-i18n="cfg.lotSize"></span></span><input type="number" id="cfg-lotSize" step="1" min="1" max="10000" /></label>
        <label class="field"><span><span data-i18n="cfg.costPerLot"></span></span><input type="number" id="cfg-costPerLot" step="1" min="0" max="10000" /></label>
        <label class="field"><span><span data-i18n="cfg.baseWinRate"></span> <em data-i18n="cfg.baseWinRate.hint"></em></span><input type="number" id="cfg-baseWinRate" step="1" min="0" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.winSensitivity"></span> <em data-i18n="cfg.winSensitivity.hint"></em></span><input type="number" id="cfg-winSensitivity" step="0.05" min="0" max="3" /></label>
        <label class="field"><span><span data-i18n="cfg.winFloor"></span></span><input type="number" id="cfg-winFloor" step="1" min="0" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.winCeiling"></span></span><input type="number" id="cfg-winCeiling" step="1" min="0" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.riskPctOfAccount"></span></span><input type="number" id="cfg-riskPctOfAccount" step="0.25" min="0.1" max="100" /></label>
      </fieldset>

      <fieldset class="settings-group">
        <legend data-i18n="cfg.g3">Stoploss Pullback Entry</legend>
        <label class="field">
          <span><span data-i18n="cfg.zone1Retrace"></span> <em data-i18n="cfg.zone1Retrace.hint"></em></span>
          <input type="number" id="cfg-zone1Retrace" step="0.001" min="0" max="1" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.zone2Retrace"></span> <em data-i18n="cfg.zone2Retrace.hint"></em></span>
          <input type="number" id="cfg-zone2Retrace" step="0.001" min="0" max="1" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.pullbackTargetMult"></span> <em data-i18n="cfg.pullbackTargetMult.hint"></em></span>
          <input type="number" id="cfg-pullbackTargetMult" step="0.05" min="0.1" max="10" />
        </label>
      </fieldset>
    </div>

    <div class="row-actions">
      <button type="button" class="btn btn-primary" id="btn-settings-save" data-i18n="cfg.save">Save settings</button>
      <button type="button" class="btn btn-ghost" id="btn-settings-reset" data-i18n="cfg.restore">Restore defaults</button>
      <span class="save-flash" id="settings-flash" role="status" aria-live="polite"></span>
    </div>
  </div>
</section>

    <button class="tab" role="tab" id="tab-pullback" aria-controls="panel-pullback" aria-selected="false" data-panel="pullback"><span class="tab-step" data-i18n="tab.phase4"></span><span data-i18n="tab.pullback"></span></button>

    <button class="tab" role="tab" id="tab-guide" aria-controls="panel-guide" aria-selected="false" data-panel="guide"><span class="tab-step" data-i18n="tab.sop"></span><span data-i18n="tab.guide"></span></button>

</nav>

<main class="wrap">

  <!-- =================== TOOL 1: OPTION ANALYSER =================== -->
  <section class="panel is-active" id="panel-analyser" role="tabpanel" aria-labelledby="tab-analyser">

    <div class="card">
      <div class="card-head">
        <h2><span class="step-pill" data-i18n="an.step1"></span> <span data-i18n="an.step1.title"></span></h2>
        <p class="muted" data-i18n="an.step1.desc"></p>
      </div>
      <div class="card-body atm-row">
        <label class="field">
          <span data-i18n="an.openLabel"></span>
          <input type="number" id="atm-open" inputmode="decimal" step="0.05" placeholder="23670" />
        </label>
        <div class="atm-result" id="atm-result" aria-live="polite"></div>
      </div>
    </div>

    <div class="card af-card">
      <div class="card-head">
        <h2><span class="step-pill" data-i18n="af.pill"></span> <span data-i18n="af.title"></span></h2>

        <div class="af-row">
          <label class="field">

            <button type="button" class="btn btn-ghost" id="btn-af-arm" data-i18n="af.arm"></button>
            <button type="button" class="btn btn-ghost" id="btn-af-disarm" data-i18n="af.disarm" hidden></button>

        <p class="muted small af-note" data-i18n-html="af.note"></p>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2><span class="step-pill" data-i18n="an.steps23"></span> <span data-i18n="an.steps23.title"></span></h2>
        <p class="muted" data-i18n="an.steps23.desc"></p>
      </div>
      <div class="card-body">
        <div class="candle-grid">
          <fieldset class="candle-box side-call">

            <div class="ohlc">
              <label class="field"><span data-i18n="f.open"></span><input type="number" id="an-ce-o" inputmode="decimal" step="0.05" placeholder="0.00" /></label>
              <label class="field"><span data-i18n="f.high"></span><input type="number" id="an-ce-h" inputmode="decimal" step="0.05" placeholder="0.00" /></label>

              <label class="field"><span data-i18n="f.close"></span><input type="number" id="an-ce-c" inputmode="decimal" step="0.05" placeholder="0.00" /></label>

          </fieldset>

          <fieldset class="candle-box side-put">
            <legend><span class="dot dot-put"></span> <span data-i18n="f.put"></span></legend>
            <div class="ohlc">
              <label class="field"><span data-i18n="f.open"></span><input type="number" id="an-pe-o" inputmode="decimal" step="0.05" placeholder="0.00" /></label>
              <label class="field"><span data-i18n="f.high"></span><input type="number" id="an-pe-h" inputmode="decimal" step="0.05" placeholder="0.00" /></label>
              <label class="field"><span data-i18n="f.low"></span><input type="number" id="an-pe-l" inputmode="decimal" step="0.05" placeholder="0.00" /></label>
              <label class="field"><span data-i18n="f.close"></span><input type="number" id="an-pe-c" inputmode="decimal" step="0.05" placeholder="0.00" /></label>
            </div>
            <p class="err" id="an-pe-err" role="alert"></p>

        <div class="row-actions">
          <button type="button" class="btn btn-primary" id="btn-analyse" data-i18n="f.analyse"></button>

          <button type="button" class="btn btn-ghost" id="btn-analyser-reset" data-i18n="f.reset"></button>

      </div>
    </div>

    <div id="analyser-output" hidden>
      <div class="card" id="analyser-bias-card">
        <div class="card-body bias-row" id="analyser-bias"></div>
      </div>

      <div class="result-grid">

        <article class="card result-card side-put" id="res-pe"></article>
      </div>

      <div class="card note-card">
        <h3><span class="step-pill" data-i18n="an.rule"></span> <span data-i18n="an.rule.title"></span></h3>
        <p data-i18n-html="an.rule.body"></p>
      </div>
    </div>
  </section>

  <!-- =================== TOOL 2: T1 DECISION HELPER =================== -->
  <section class="panel" id="panel-t1" role="tabpanel" aria-labelledby="tab-t1" hidden>

    <div class="card t1-hero">
      <span class="hero-badge" data-i18n="t1.badge"></span>
      <h2 data-i18n="t1.hero"></h2>
      <p class="muted" data-i18n="t1.heroSub"></p>
    </div>

    <div class="card">
      <div class="card-head">
        <h2><span class="step-pill" data-i18n="t1.steps67"></span> <span data-i18n="t1.steps67.title"></span></h2>
        <p class="muted" data-i18n="t1.steps67.desc"></p>
      </div>
      <div class="card-body">
        <div class="side-toggle" role="radiogroup" aria-label="Trade side">
          <button type="button" class="side-btn is-active" role="radio" aria-checked="true" data-side="call" data-i18n="t1.callTrade"></button>
          <button type="button" class="side-btn" role="radio" aria-checked="false" data-side="put" data-i18n="t1.putTrade"></button>
        </div>

        <div class="mapping-note">
          <span class="map-item"><b data-i18n="t1.mapEntry"></b> ← <i data-i18n="t1.mapEntryFrom"></i></span>
          <span class="map-arrow">·</span>
          <span class="map-item"><b data-i18n="t1.mapT1"></b> ← <i data-i18n="t1.mapT1From"></i></span>
          <span class="map-arrow">·</span>
          <span class="map-item"><b data-i18n="t1.mapT2"></b> ← <i data-i18n="t1.mapT2From"></i></span>
        </div>

        <div class="ohlc ohlc-3">
          <label class="field"><span><span data-i18n="t1.entryLabel"></span> <em data-i18n="t1.entryHint"></em></span><input type="number" id="t1-entry" inputmode="decimal" step="0.05" placeholder="0.00" /></label>
          <label class="field"><span><span data-i18n="t1.t1Label"></span> <em data-i18n="t1.t1Hint"></em></span><input type="number" id="t1-t1" inputmode="decimal" step="0.05" placeholder="0.00" /></label>

<script>
/* Shared helpers. Attached to window.APP so the files load as plain scripts
   and the page also works when opened straight from disk. */
window.APP = window.APP || {};

(function (APP) {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* Parse an input value. Returns NaN for blank/garbage so callers can validate. */
  function num(value) {
    if (value === null || value === undefined) return NaN;
    var s = String(value).trim();
    if (s === '') return NaN;
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  function fmt(n, decimals) {
    if (!isFinite(n)) return '—';
    var d = decimals === undefined ? 2 : decimals;
    return n.toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  function pct(fraction, decimals) {
    if (!isFinite(fraction)) return '—';
    return fmt(fraction * 100, decimals === undefined ? 1 : decimals) + '%';
  }

  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

  /* Round to the nearest tick so displayed levels are actually placeable. */
  function toTick(value, tick) {
    if (!isFinite(value)) return NaN;
    var t = isFinite(tick) && tick > 0 ? tick : 0.05;
    return Math.round(value / t) * t;
  }

  /* Read an OHLC group whose inputs are `<prefix>-o|h|l|c`. */
  function readCandle(prefix) {
    return {
      o: num($(prefix + '-o').value),
      h: num($(prefix + '-h').value),
      l: num($(prefix + '-l').value),
      c: num($(prefix + '-c').value)
    };
  }

  function writeCandle(prefix, candle) {
    ['o', 'h', 'l', 'c'].forEach(function (k) {
      var el = $(prefix + '-' + k);
      if (el) el.value = isFinite(candle[k]) ? String(candle[k]) : '';
    });
  }

  function clearCandle(prefix) {
    ['o', 'h', 'l', 'c'].forEach(function (k) {
      var el = $(prefix + '-' + k);
      if (el) { el.value = ''; el.classList.remove('is-invalid'); }
    });
  }

  /* Validate a candle. Returns [] when usable, otherwise a list of messages.
     Also flags the offending inputs when a prefix is supplied. */
  function validateCandle(candle, label, prefix) {
    var t = window.APP.i18n.t;
    var errors = [];
    var bad = {};
    var fieldKeys = { o: 'f.open', h: 'f.high', l: 'f.low', c: 'f.close' };

    Object.keys(fieldKeys).forEach(function (k) {
      var field = t(fieldKeys[k]);
      if (!isFinite(candle[k])) { errors.push(t('v.required', { label: label, field: field })); bad[k] = true; }
      else if (candle[k] <= 0) { errors.push(t('v.positive', { label: label, field: field })); bad[k] = true; }
    });

    if (!errors.length) {
      if (candle.h < candle.l) {
        errors.push(t('v.highLow', { label: label }));
        bad.h = bad.l = true;
      }
      if (candle.h < Math.max(candle.o, candle.c)) {
        errors.push(t('v.highMax', { label: label }));
        bad.h = true;
      }
      if (candle.l > Math.min(candle.o, candle.c)) {
        errors.push(t('v.lowMin', { label: label }));
        bad.l = true;
      }
      if (candle.h === candle.l) {
        errors.push(t('v.noRange', { label: label }));
        bad.h = bad.l = true;
      }
    }

    if (prefix) {
      ['o', 'h', 'l', 'c'].forEach(function (k) {
        var el = $(prefix + '-' + k);
        if (el) el.classList.toggle('is-invalid', !!bad[k]);
      });
    }
    return errors;
  }

  function showErrors(elId, errors) {
    var el = $(elId);
    if (!el) return;
    el.textContent = errors && errors.length ? errors.join(' ') : '';
  }

  /* Descriptive stats shared by all three tools. */
  function candleStats(candle) {
    var range = candle.h - candle.l;
    var body = Math.abs(candle.c - candle.o);
    return {
      range: range,
      body: body,
      bodyRatio: range > 0 ? body / range : 0,
      closePos: range > 0 ? (candle.c - candle.l) / range : 0.5,
      upperWick: range > 0 ? (candle.h - candle.c) / range : 0,
      lowerWick: range > 0 ? (candle.c - candle.l) / range : 0,
      bullish: candle.c > candle.o,
      mid: (candle.h + candle.l) / 2,
      pivot: (candle.h + candle.l + candle.c) / 3
    };
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  APP.util = {
    $: $, $$: $$, num: num, fmt: fmt, pct: pct, clamp: clamp, toTick: toTick,
    readCandle: readCandle, writeCandle: writeCandle, clearCandle: clearCandle,
    validateCandle: validateCandle, showErrors: showErrors,
    candleStats: candleStats, escapeHtml: escapeHtml
  };
})(window.APP);
</script>

      'g.p1s1': '<b>ATM strike கண்டுபிடி.</b> NIFTY chart-ஐ திற, first 5-minute candle-ஓட (09:15–09:20) open-ஐ பாத்து கீழ 100 strike-க்கு round பண்ணு. Open 23670 → 23600 CE, 23600 PE.',

      'g.p3s9': '<b>Decide பண்ணு.</b> <i>Hold → T2</i> ஆனா target reach ஆகுற chance அதிகம், trade-ஐ hold பண்ணலாம். <i>Book now / partial book</i> ஆனா chance குறைவு — exit பண்ணு அல்லது avoid பண்ணு.',

      'g.p4s12': '<b>Direction check பண்ணு.</b> Tool Call Buy அல்லது Put Buy காட்டும் — recommend பண்ண side-ல மட்டும் trade பண்ணு.',

      'g.p5': 'Phase 5 · Trade Signal (confluence, edge & alerts)',
      'g.p5s14': '<b>Levels-ஐ கொண்டு வா</b> — அப்புறம் NIFTY chart-ல இருந்து market-standard filters படி: VWAP, EMA 20/50, RSI, average-க்கு எதிரான volume, India VIX, நேரம். படிக்க முடியலைனா அது skip ஆகும், ஊகம் பண்ணாது.',
      'g.p5s15': '<b>Size-க்கு முன்னாடி edge-ஐ பாரு.</b> Win estimate-ன்னா உன் base rate-ஐ confluence நகர்த்தினது; பக்கத்துல இருக்கிற breakeven win rate சரியான கணக்கு. Estimate breakeven-ஐ தாண்டி, expected value positive-ஆ இருந்தா மட்டும் trade எடு.',
      'g.p5s16': '<b>Alerts on பண்ணு.</b> Signal-ஓட win estimate, expected profit, expected value எல்லாம் சேர்த்து browser notification வரும்; page திறந்திருக்கிற வரைக்கும் ஒவ்வொரு 5-minute candle close-க்கும் reminder வரும்.',
      'g.f5': 'Trade Signal — confluence, edge, expectancy',
      'g.f5n': 'Skip ஆன filters ratio-ஓட ரெண்டு பக்கத்துலயும் சேராது, அதனால பாதி data இருந்தாலும் நியாயமா score ஆகும். Expected value-ம் breakeven win rate-ம் சாதாரண கணக்கு; win estimate மட்டும்தான் judgement — அது நீ கொடுக்குற base rate-ஐ சுத்திதான் நகரும்.',
      'g.formulas': 'ஒவ்வொரு number-ம் எப்படி கணக்கிடப்படுது',
      'g.formulasDesc': 'எந்த level-ஐ எந்த tool கொடுக்கும்னு strategy guide சொல்லுது, கணக்கு சொல்லல. இந்த suite கீழ இருக்கிற first-candle range model-ஐ பயன்படுத்துது; ஒவ்வொரு coefficient-ஐயும் Formula settings-ல மாத்திக்கலாம்.',
