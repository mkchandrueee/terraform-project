      'al.noSignalBody': 'முதல்ல signal எடு, அப்புறம் notification-ஆ அனுப்பு.',
      'al.logTitle': 'Alert log',
      'al.logEmpty': 'இன்னும் alert இல்ல.',

      /* footer */
      'foot.warn': 'Educational tool மட்டும்தான்.',
      'foot.body': 'இது investment advice இல்ல, trade பண்ண சொல்ற recommendation-ம் இல்ல. Options-ல நஷ்டம் வர்ற risk அதிகம்; நீ type பண்ற value-ல இருந்து கணக்கு போட்டு வர்ற level-கள் மட்டும்தான் இது, இது நடக்கும்னு எந்த உத்தரவாதமும் இல்ல. Trade பண்றதுக்கு முன்னாடி ஒவ்வொரு number-ஐயும் உன் broker terminal-ல verify பண்ணு.',
      'foot.privacy': 'எல்லா input-ம் உன் browser-லயே இருக்கும் — எதுவும் upload ஆகாது, server-ல store ஆகாது.'
    }
  };

  function t(key, vars) {
    var table = STRINGS[lang] || STRINGS.en;
    var str = table[key];
    if (str === undefined) str = STRINGS.en[key];
    if (str === undefined) return key;
    if (!vars) return str;
    return str.replace(/\{(\w+)\}/g, function (match, name) {
      return vars[name] !== undefined ? vars[name] : match;
    });
  }

  /* Replace the text of every tagged node. data-i18n sets textContent,
     data-i18n-html sets innerHTML for strings that carry markup. */
  function apply(root) {
    var scope = root || document;
    Array.prototype.forEach.call(scope.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(scope.querySelectorAll('[data-i18n-html]'), function (el) {
      el.innerHTML = t(el.getAttribute('data-i18n-html'));
    });
    document.documentElement.lang = lang === 'ta' ? 'ta' : 'en';
  }

  function set(next) {
    lang = next === 'ta' ? 'ta' : 'en';
    try { window.localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* ignore */ }
    apply();
    listeners.forEach(function (fn) { fn(lang); });
  }

  function init() {
    try {
      var stored = window.localStorage.getItem(STORAGE_KEY);
      if (stored === 'ta' || stored === 'en') lang = stored;
    } catch (e) { /* ignore */ }
    apply();
  }

  APP.i18n = {
    t: t,
    apply: apply,
    set: set,
    init: init,
    get: function () { return lang; },
    onChange: function (fn) { listeners.push(fn); }
  };
})(window.APP);
</script>
<script>
/* Tunable model coefficients + browser persistence.

   The strategy guide fixes *what* each tool outputs (entry / T1 / stop loss,
   hold-vs-book, buy side / zone 1 / target 1) but not the arithmetic. Every
   number that drives those outputs lives here so it can be re-tuned without
   touching the tools themselves. */
(function (APP) {
  'use strict';

  var STORAGE_KEY = 'nifty-option-suite:v1';

  var DEFAULTS = {
    /* Option Analyser */
    entryBufferPct: 0,      // % of range added above the first-candle high
    slBufferPct: 0,         // % of range subtracted below the first-candle low
    t1Multiplier: 1.0,      // Target 1 = entry + (multiplier x range)
    tickSize: 0.05,         // exchange tick; confirmation must clear entry by one

    /* T1 Decision Helper.
       Momentum = direction 40 + body {strong 15, moderate 7.5, weak 0} + close 40,
       floored. Those weights reproduce the reference tool's published scores. */
    bodyStrong: 0.65,       // body / range at or above this is strong momentum
    bodyModerate: 0.45,     // between moderate and strong scores half credit
    minClosePos: 0.50,      // close must sit in the upper half of its range
    holdThreshold: 70,      // momentum at or above this => HOLD T2
    partialThreshold: 40,   // momentum at or above this => PARTIAL BOOK, below => BOOK NOW
    sideAwareDirection: 0,  // 0 = rising premium is good on both sides (you are long the
                            // option either way); 1 = a put trade wants a falling candle,
                            // reproducing the original helper tool's behaviour

    /* Stoploss Pullback Entry */
    zone1Retrace: 0.382,    // zone 1 = low + (fraction x range)
    zone2Retrace: 0.236,    // deeper liquidity fill
    pullbackTargetMult: 1.0, // target 1 = high + (multiplier x range)

    /* Trade Signal — market-standard filter thresholds */
    rsiMin: 55,             // call wants RSI in [rsiMin, rsiMax]; put mirrors it
    rsiMax: 78,
    volumeMin: 1.2,         // breakout volume as a multiple of the average
    vixMax: 25,             // above this the levels understate the swings
    atrReachMax: 2.0,       // T2 distance as a multiple of the reference range
    minRR: 1.5,             // minimum risk:reward to T2
    takeThreshold: 65,      // confluence needed for a full-size TAKE TRADE

    /* Trade Signal — money and sizing */
    lotSize: 75,            // NIFTY contract size
    costPerLot: 50,         // round-trip brokerage and charges per lot
    baseWinRate: 50,        // your own historical win rate, the anchor
    winSensitivity: 0.6,    // how far confluence moves the estimate off that base
    winFloor: 15,           // the estimate never claims more certainty than this
    winCeiling: 85,
    riskPctOfAccount: 2     // risk budget per trade, for the sizing suggestion
  };

  var state = null;

  function load() {
    var stored = {};
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) stored = JSON.parse(raw) || {};
    } catch (e) {
      stored = {}; // private mode / disabled storage / corrupt value
    }
    state = {};
    Object.keys(DEFAULTS).forEach(function (k) {
      var v = Number(stored[k]);
      state[k] = isFinite(v) ? v : DEFAULTS[k];
    });
    return state;
  }

  function get() { return state || load(); }

  function save(patch) {
    var cfg = get();
    Object.keys(patch || {}).forEach(function (k) {
      if (!(k in DEFAULTS)) return;
      var v = Number(patch[k]);
      if (isFinite(v)) cfg[k] = v;
    });
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    } catch (e) { /* nothing persistable — keep the in-memory values */ }
    return cfg;
  }

  function reset() {
    state = null;
    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    return load();
  }

  APP.config = { DEFAULTS: DEFAULTS, get: get, save: save, reset: reset, load: load };
})(window.APP);
</script>
<script>
/* Tool 1 — Option Analyser (Phases 1–2, steps 1–5).

   Input : the 09:15–09:20 candle of the ATM call and the ATM put.
   Output: entry price, Target 1 and stop loss for each side, plus the
           confirmation level that a later 5-minute candle must close above. */
(function (APP) {
  'use strict';

  var U = APP.util;
  function t(key, vars) { return APP.i18n.t(key, vars); }

  /* ---------- ATM strike (step 1) ----------
     The guide's own example rounds 23670 down to 23600, so the strike is the
     100-multiple at or below the open, not the arithmetically nearest one. */
  function atmStrike(spotOpen, stepSize) {
    var step = stepSize || 100;
    if (!isFinite(spotOpen) || spotOpen <= 0) return NaN;
    return Math.floor(spotOpen / step) * step;
  }

  /* ---------- level model (steps 3–4) ---------- */
  function analyseSide(candle, cfg) {
    var s = U.candleStats(candle);
    var range = s.range;

    var entry = U.toTick(candle.h + (cfg.entryBufferPct / 100) * range, cfg.tickSize);
    var stopLoss = U.toTick(candle.l - (cfg.slBufferPct / 100) * range, cfg.tickSize);
    var target1 = U.toTick(entry + cfg.t1Multiplier * range, cfg.tickSize);

    var risk = entry - stopLoss;
    var reward = target1 - entry;

    /* How convincingly the first candle closed — used only to flag which side
       to watch first, never as a trade signal on its own. */
    var strength = U.clamp(
      0.50 * s.closePos + 0.30 * s.bodyRatio + 0.20 * (s.bullish ? 1 : 0),
      0, 1
    );

    return {
      candle: candle,
      stats: s,
      range: range,
      entry: entry,
      target1: target1,
      stopLoss: stopLoss,
      risk: risk,
      reward: reward,
      rr: risk > 0 ? reward / risk : NaN,
      confirmClose: U.toTick(entry + cfg.tickSize, cfg.tickSize),
      riskPctOfEntry: entry > 0 ? risk / entry : NaN,
      strength: strength
    };
  }

  function analyse(ceCandle, peCandle, cfg) {
    var ce = analyseSide(ceCandle, cfg);
    var pe = analyseSide(peCandle, cfg);
    var gap = ce.strength - pe.strength;
    var bias = Math.abs(gap) < 0.05 ? 'flat' : (gap > 0 ? 'call' : 'put');
    return { ce: ce, pe: pe, bias: bias, biasGap: Math.abs(gap) };
  }

  /* ---------- rendering ---------- */
  function levelBlock(r) {
    return '' +
      '<div class="levels">' +
        '<div class="level level-entry"><div class="level-label">' + t('an.entryPrice') + '</div><div class="level-value">' + U.fmt(r.entry) + '</div></div>' +
        '<div class="level level-target"><div class="level-label">' + t('an.target1') + '</div><div class="level-value">' + U.fmt(r.target1) + '</div></div>' +
        '<div class="level level-sl"><div class="level-label">' + t('an.stopLoss') + '</div><div class="level-value">' + U.fmt(r.stopLoss) + '</div></div>' +
      '</div>';
  }

  function metricsBlock(r, isPut) {
    return '' +
      '<div class="metrics">' +
        '<div class="metric"><span>' + t('an.range') + '</span><span>' + U.fmt(r.range) + '</span></div>' +
        '<div class="metric"><span>' + t('an.risk') + '</span><span>' + U.fmt(r.risk) + '</span></div>' +
        '<div class="metric"><span>' + t('an.reward') + '</span><span>' + U.fmt(r.reward) + '</span></div>' +
        '<div class="metric"><span>' + t('an.rr') + '</span><span>' + (isFinite(r.rr) ? '1 : ' + U.fmt(r.rr) : '—') + '</span></div>' +
        '<div class="metric"><span>' + t('an.riskPct') + '</span><span>' + U.pct(r.riskPctOfEntry) + '</span></div>' +
        '<div class="metric"><span>' + t('an.closePos') + '</span><span>' + U.pct(r.stats.closePos) + '</span></div>' +
        '<div class="metric"><span>' + t('an.bodyPct') + '</span><span>' + U.pct(r.stats.bodyRatio) + '</span></div>' +
        '<div class="metric"><span>' + t('an.strength') + '</span><span>' + U.pct(r.strength, 0) + '</span></div>' +
      '</div>' +
      '<div class="bar' + (isPut ? ' bar-put' : '') + '"><i style="width:' + U.fmt(r.strength * 100, 0) + '%"></i></div>';
  }

  function renderSide(elId, title, r, isPut, isPrimary) {
    var el = U.$(elId);
    el.innerHTML = '' +
      '<h3 class="result-title">' + U.escapeHtml(title) +
        (isPrimary ? '<span class="badge-primary">' + U.escapeHtml(t('an.primary')) + '</span>' : '') +
      '</h3>' +
      levelBlock(r) +
      metricsBlock(r, isPut) +
      '<p class="confirm-line">' +
        t('an.confirm', { close: U.fmt(r.confirmClose), entry: U.fmt(r.entry) }) + '</p>' +
      '<div class="row-actions">' +
        '<button type="button" class="btn btn-sm" data-send-t1="' + (isPut ? 'put' : 'call') + '">' +
          U.escapeHtml(t('an.sendT1')) + '</button>' +
      '</div>';
  }

  function renderBias(result) {
    var el = U.$('analyser-bias');
    var tag, text;
    if (result.bias === 'call') {
      tag = '<span class="bias-tag bias-call">' + U.escapeHtml(t('an.biasCall')) + '</span>';
      text = t('an.biasCallText');
    } else if (result.bias === 'put') {
      tag = '<span class="bias-tag bias-put">' + U.escapeHtml(t('an.biasPut')) + '</span>';
      text = t('an.biasPutText');
    } else {
      tag = '<span class="bias-tag bias-flat">' + U.escapeHtml(t('an.biasFlat')) + '</span>';
      text = t('an.biasFlatText');
    }
    el.innerHTML = tag + '<span class="muted small">' + U.escapeHtml(text) + '</span>';
  }

  function render(result) {
    renderSide('res-ce', t('f.call'), result.ce, false, result.bias === 'call');
    renderSide('res-pe', t('f.put'), result.pe, true, result.bias === 'put');
    renderBias(result);
    U.$('analyser-output').hidden = false;
  }

  function renderAtm() {
    var el = U.$('atm-result');
    var open = U.num(U.$('atm-open').value);
    if (!isFinite(open) || open <= 0) {
      el.innerHTML = '<span class="muted small">' + U.escapeHtml(t('an.atmHint')) + '</span>';
      return;
    }
    var strike = atmStrike(open);
    el.innerHTML = '' +
      '<div>' +
        '<div class="atm-strike">' + U.fmt(strike, 0) + '</div>' +
        '<div class="atm-legs">' +
          '<span class="leg leg-call">' + U.fmt(strike, 0) + ' CE</span>' +
          '<span class="leg leg-put">' + U.fmt(strike, 0) + ' PE</span>' +
        '</div>' +
        '<div class="muted small" style="margin-top:6px">' +
          U.escapeHtml(t('an.atmRounded', { open: U.fmt(open) })) + '</div>' +
      '</div>';
  }

  /* ---------- controller ---------- */
  function run() {
    var cfg = APP.config.get();
    var ce = U.readCandle('an-ce');
    var pe = U.readCandle('an-pe');

    var ceErrors = U.validateCandle(ce, t('v.call'), 'an-ce');
    var peErrors = U.validateCandle(pe, t('v.put'), 'an-pe');
    U.showErrors('an-ce-err', ceErrors);
    U.showErrors('an-pe-err', peErrors);

    if (ceErrors.length || peErrors.length) {
      U.$('analyser-output').hidden = true;
      APP.state.analyser = null;
      return null;
    }

    var result = analyse(ce, pe, cfg);
    APP.state.analyser = result;
    render(result);
    return result;
  }

  function reset() {
    U.clearCandle('an-ce');
    U.clearCandle('an-pe');
    U.$('atm-open').value = '';
    U.showErrors('an-ce-err', []);
    U.showErrors('an-pe-err', []);
    U.$('analyser-output').hidden = true;
    APP.state.analyser = null;
    renderAtm();
  }

  function loadSample() {
    U.$('atm-open').value = '23670';
    U.writeCandle('an-ce', { o: 148.5, h: 162.75, l: 141.2, c: 159.9 });
    U.writeCandle('an-pe', { o: 155.0, h: 158.4, l: 132.6, c: 137.15 });
    renderAtm();
    run();
  }

  function init() {
    U.$('btn-analyse').addEventListener('click', run);
    U.$('btn-analyser-reset').addEventListener('click', reset);
    U.$('btn-analyser-sample').addEventListener('click', loadSample);
    U.$('atm-open').addEventListener('input', renderAtm);

    /* Enter anywhere in the candle inputs runs the analysis. */
    U.$$('#panel-analyser .candle-box input').forEach(function (input) {
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    });

    /* Hand-off buttons are rendered with the results, so delegate. */
    U.$('analyser-output').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-send-t1]');
      if (btn) APP.t1helper.importFromAnalyser(btn.getAttribute('data-send-t1'));
    });
  }

  APP.analyser = {
    init: init,
    run: run,
    reset: reset,
    analyse: analyse,
    analyseSide: analyseSide,
    atmStrike: atmStrike,
    renderAtm: renderAtm
  };
})(window.APP);
</script>
<script>
/* Auto-fill the first-candle values from the local NSE helper.

   The page cannot call nseindia.com itself — NSE sends no CORS headers and
   gates its APIs behind session cookies, so the browser blocks the request
   before it leaves the tab. tools/nse-fetch.js does the handshake on your
   machine and re-serves the candle on localhost; this module talks to that.

   Nothing here is required: if the helper is not running you get a clear
   message and type the four values in as before. */
(function (APP) {
  'use strict';

  var U = APP.util;
  function t(key, vars) { return APP.i18n.t(key, vars); }

  var STORAGE_KEY = 'nifty-option-suite:endpoint';
  var DEFAULT_ENDPOINT = 'http://127.0.0.1:8123';

  /* The window the user asked for: fire just after the 09:20 candle closes and
     keep retrying for a minute in case the feed lags. */
  var ARM_AT = { h: 9, m: 21, s: 5 };
  var RETRY_MS = 15000;
  var GIVE_UP = { h: 9, m: 22, s: 30 };

  var armTimer = null;
  var retryTimer = null;
  var lastPayload = null;

  function endpoint() {
    var el = U.$('af-endpoint');
    var value = (el && el.value || '').trim().replace(/\/+$/, '');
    return value || DEFAULT_ENDPOINT;
  }

  function saveEndpoint() {
    try { window.localStorage.setItem(STORAGE_KEY, endpoint()); } catch (e) { /* ignore */ }
  }

  function loadEndpoint() {
    var stored = null;
    try { stored = window.localStorage.getItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    U.$('af-endpoint').value = stored || DEFAULT_ENDPOINT;
  }

  function status(kind, message) {
    var el = U.$('af-status');
    el.className = 'af-status af-' + kind;
    el.textContent = message;
  }

  function clock(date) {
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
  }

  function atTime(spec, from) {
    var d = new Date(from);
    d.setHours(spec.h, spec.m, spec.s, 0);
    return d;
  }

  /* ---------- fetching ---------- */
  function request(fresh) {
    var url = endpoint() + '/first-candle' + (fresh ? '?fresh=1' : '');
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timeout = window.setTimeout(function () { if (controller) controller.abort(); }, 12000);

    return window.fetch(url, { signal: controller ? controller.signal : undefined })
      .then(function (res) {
        return res.json().then(function (body) {
          if (!res.ok) throw new Error(body && body.error ? body.error : 'HTTP ' + res.status);
          return body;
        });
      })
      .finally(function () { window.clearTimeout(timeout); });
  }

  function validPayload(p) {
    if (!p || !p.ce || !p.pe) return false;
    return ['o', 'h', 'l', 'c'].every(function (k) {
      return isFinite(p.ce[k]) && p.ce[k] > 0 && isFinite(p.pe[k]) && p.pe[k] > 0;
    });
  }

  function applyPayload(p) {
    U.writeCandle('an-ce', p.ce);
    U.writeCandle('an-pe', p.pe);
    if (isFinite(p.underlying)) {
      U.$('atm-open').value = String(p.underlying);
      APP.analyser.renderAtm();
    }
    lastPayload = p;
    APP.analyser.run();
  }

  function fetchNow(fresh, quiet) {
    status('busy', t('af.fetching'));
    return request(fresh).then(function (p) {
      if (!validPayload(p)) throw new Error(t('af.badPayload'));
      applyPayload(p);
      status('ok', t('af.filled', {
        atm: U.fmt(p.atm, 0),
        time: p.asOf || clock(new Date()),
        source: p.source === 'mock' ? t('af.mockSource') : p.source,
        ticks: (p.ce.ticks || 0) + (p.pe.ticks || 0)
      }));
      return p;
    }).catch(function (err) {
      var msg = String(err && err.message || err);
      var offline = /Failed to fetch|NetworkError|abort/i.test(msg);
      status('err', offline
        ? t('af.helperOffline', { endpoint: endpoint() })
        : t('af.failed', { reason: msg }));
      if (!quiet) throw err;
      return null;
    });
  }

  /* ---------- the 09:21 schedule ---------- */
  function stopRetries() {
    if (retryTimer) { window.clearInterval(retryTimer); retryTimer = null; }
  }

  function runWindow() {
    stopRetries();
    var giveUp = atTime(GIVE_UP, new Date());

    var attempt = function () {
      if (Date.now() > giveUp.getTime()) {
        stopRetries();
        status('err', t('af.windowMissed'));
        disarm(true);
        return;
      }
      fetchNow(true, true).then(function (p) {
        if (p) { stopRetries(); disarm(true); }
      });
    };

    attempt();
    retryTimer = window.setInterval(attempt, RETRY_MS);
  }

  function arm() {
    disarm(true);
    var now = new Date();
    var due = atTime(ARM_AT, now);
    if (due.getTime() <= now.getTime()) due.setDate(due.getDate() + 1);

    armTimer = window.setTimeout(runWindow, due.getTime() - now.getTime());
    U.$('btn-af-arm').hidden = true;
    U.$('btn-af-disarm').hidden = false;
    status('armed', t('af.armed', { time: clock(due) }));
  }

  function disarm(keepStatus) {
    if (armTimer) { window.clearTimeout(armTimer); armTimer = null; }
    stopRetries();
    U.$('btn-af-arm').hidden = false;
    U.$('btn-af-disarm').hidden = true;
    if (!keepStatus) status('idle', t('af.idle'));
  }

  function checkHealth() {
    status('busy', t('af.checking'));
    return window.fetch(endpoint() + '/health')
      .then(function (r) { return r.json(); })
      .then(function (h) {
        status('ok', t('af.healthy', {
          mode: h.mode === 'mock' ? t('af.mockSource') : t('af.liveSource'),
          symbol: h.symbol || '—',
          ist: h.ist || '—'
        }));
      })
      .catch(function () {
        status('err', t('af.helperOffline', { endpoint: endpoint() }));
      });
  }

  function init() {
    loadEndpoint();
    U.$('af-endpoint').addEventListener('change', saveEndpoint);
    U.$('btn-af-now').addEventListener('click', function () { fetchNow(true).catch(function () {}); });
    U.$('btn-af-health').addEventListener('click', checkHealth);
    U.$('btn-af-arm').addEventListener('click', function () { arm(); });
    /* not `addEventListener('click', disarm)` — the click Event would arrive as
       keepStatus and leave the stale "armed" message on screen. */
    U.$('btn-af-disarm').addEventListener('click', function () { disarm(); });
    status('idle', t('af.idle'));
  }

  APP.autofetch = {
    init: init, fetchNow: fetchNow, arm: arm, disarm: disarm,
    checkHealth: checkHealth, applyPayload: applyPayload, validPayload: validPayload,
    last: function () { return lastPayload; }
  };
})(window.APP);
</script>
<script>
/* Tool 2 — T1 Decision Helper (Phase 3, steps 6–10).

   Input : the trade side, the three mapped levels (entry = analyser stop loss,
           T1 = analyser entry price, T2 = analyser Target 1) and the OHLC of
           the 5-minute candle that touched T1.
   Output: hold-to-T2 vs partial book vs book now, a momentum score, the
           T1→T2 reward ratio, four condition checks, the condition-4 gate and
           a step-by-step action plan.

   Momentum weights are direction 40, body {strong 15, moderate 7.5, weak 0}
   and close 40, floored — the combination that reproduces the reference
   tool's own published scores of 0%, 15% and 87%. */
(function (APP) {
  'use strict';

  var U = APP.util;
  var side = 'call';

  var W_DIRECTION = 40;
  var W_BODY_STRONG = 15;
  var W_BODY_MODERATE = 7.5;
  var W_CLOSE = 40;

  function t(key, vars) { return APP.i18n.t(key, vars); }
  function money(n) { return '₹' + U.fmt(n); }

  /* ---------- decision model ---------- */
  function decide(levels, candle, cfg) {
    var s = U.candleStats(candle);
    var isPut = levels.side === 'put';
    /* You are long the option on both legs, so a rising premium is a gain for a
       put trade too. The original tool inverts the put side; that is available
       behind a setting rather than baked in. */
    var wantFalling = cfg.sideAwareDirection >= 1 && isPut;

    var directionPass = wantFalling ? !s.bullish : s.bullish;
    var closePass = wantFalling ? (s.closePos <= 1 - cfg.minClosePos) : (s.closePos >= cfg.minClosePos);
    var bodyStatus = s.bodyRatio >= cfg.bodyStrong ? 'pass'
                   : (s.bodyRatio >= cfg.bodyModerate ? 'warn' : 'fail');
    var breakoutPass = candle.c > levels.t1;
    var breakoutGap = candle.c - levels.t1;

    var bodyDetail = bodyStatus === 'pass'
      ? t('t1.c2.strong', { pct: U.pct(s.bodyRatio), min: U.pct(cfg.bodyStrong, 0) })
      : (bodyStatus === 'warn'
          ? t('t1.c2.moderate', { pct: U.pct(s.bodyRatio), min: U.pct(cfg.bodyModerate, 0), max: U.pct(cfg.bodyStrong, 0) })
          : t('t1.c2.weak', { pct: U.pct(s.bodyRatio) }));

    var closeDetail = wantFalling
      ? t(closePass ? 't1.c3.invStrong' : 't1.c3.invWeak', { pct: U.pct(s.closePos) })
      : t(closePass ? 't1.c3.strong' : 't1.c3.weak', { pct: U.pct(1 - s.closePos) });

    var checks = [
      {
        id: 1,
        status: directionPass ? 'pass' : 'fail',
        name: t('t1.c1'),
        detail: wantFalling
          ? t(s.bullish ? 't1.c1.invAgainst' : 't1.c1.invMatch')
          : t(s.bullish ? 't1.c1.match' : 't1.c1.against')
      },
      { id: 2, status: bodyStatus, name: t('t1.c2'), detail: bodyDetail },
      { id: 3, status: closePass ? 'pass' : 'fail', name: t('t1.c3'), detail: closeDetail },
      {
        id: 4,
        critical: true,
        status: breakoutPass ? 'pass' : 'fail',
        name: t('t1.c4'),
        detail: t(breakoutPass ? 't1.c4.pass' : 't1.c4.fail', { gap: money(Math.abs(breakoutGap)) })
      }
    ];

    /* Momentum is the three candle-quality checks; the breakout is the gate. */
    var bodyPoints = bodyStatus === 'pass' ? W_BODY_STRONG
                   : (bodyStatus === 'warn' ? W_BODY_MODERATE : 0);
    var momentum = Math.floor(
      (directionPass ? W_DIRECTION : 0) + bodyPoints + (closePass ? W_CLOSE : 0)
    );

    var riskLeg = levels.t1 - levels.entry;
    var rewardLeg = levels.t2 - levels.t1;
    var rewardRatio = riskLeg > 0 ? rewardLeg / riskLeg : NaN;
    var expected = levels.t2 - levels.entry;

    var verdict, headline, explain;
    if (!breakoutPass) {
      verdict = 'wait';
      headline = t('t1.wait');
      explain = t('t1.waitText', { t1: money(levels.t1) });
    } else if (momentum >= cfg.holdThreshold) {
      verdict = 'hold';
      headline = t('t1.hold');
      explain = t('t1.holdText', { momentum: momentum, t2: money(levels.t2), expected: U.fmt(expected) });
    } else if (momentum >= cfg.partialThreshold) {
      verdict = 'partial';
      headline = t('t1.partial');
      explain = t('t1.partialText', { momentum: momentum, t2: money(levels.t2) });
    } else {
      verdict = 'book';
      headline = t('t1.book');
      explain = t('t1.bookText', { momentum: momentum });
    }

    return {
      side: levels.side,
      levels: levels,
      stats: s,
      checks: checks,
      check4: checks[3],
      momentum: momentum,
      rewardRatio: rewardRatio,
      expected: expected,
      breakoutGap: breakoutGap,
      verdict: verdict,
      headline: headline,
      explain: explain,
      plan: actionPlan(verdict, levels)
    };
  }

  /* ---------- action plan ---------- */
  function actionPlan(verdict, levels) {
    var vars = { entry: money(levels.entry), t1: money(levels.t1), t2: money(levels.t2) };
    var prefix = 't1.plan.' + verdict;
    return [1, 2, 3, 4, 5].map(function (n) { return t(prefix + n, vars); });
  }

  /* ---------- what the mapped ladder means in trade terms ---------- */
  function renderReading() {
    var el = U.$('t1-reading');
    var entry = U.num(U.$('t1-entry').value);
    var t1 = U.num(U.$('t1-t1').value);
    var t2 = U.num(U.$('t1-t2').value);
    if (!(isFinite(entry) && isFinite(t1) && isFinite(t2))) { el.hidden = true; el.innerHTML = ''; return; }
    el.innerHTML =
      '<b>' + U.escapeHtml(t('t1.reading', { entry: money(entry), t1: money(t1), t2: money(t2) })) + '</b>' +
      '<span>' + U.escapeHtml(t('t1.readingHint')) + '</span>';
    el.hidden = false;
  }

  /* ---------- candle preview ---------- */
  function renderPreview() {
    var el = U.$('t1-preview');
    var c = U.readCandle('t1');
    var usable = ['o', 'h', 'l', 'c'].every(function (k) { return isFinite(c[k]) && c[k] > 0; }) &&
                 c.h > c.l && c.h >= Math.max(c.o, c.c) && c.l <= Math.min(c.o, c.c);
    if (!usable) { el.hidden = true; el.innerHTML = ''; return; }

    var s = U.candleStats(c);
    var H = 130, PAD = 3, CX = 26;
    var y = function (price) { return PAD + (c.h - price) / s.range * H; };
    var top = y(Math.max(c.o, c.c));
    var height = Math.max(2, Math.abs(y(c.c) - y(c.o)));
    var colour = s.bullish ? 'var(--call)' : 'var(--put)';

    el.innerHTML = '' +
      '<svg class="candle-svg" viewBox="0 0 52 ' + (H + PAD * 2) + '" width="52" height="' + (H + PAD * 2) + '" role="img" ' +
        'aria-label="' + U.fmt(c.l) + ' – ' + U.fmt(c.h) + ', close ' + U.fmt(c.c) + '">' +
        '<line x1="' + CX + '" y1="' + y(c.h) + '" x2="' + CX + '" y2="' + y(c.l) + '" stroke="' + colour + '" stroke-width="2.5"/>' +
        '<rect x="' + (CX - 13) + '" y="' + top + '" width="26" height="' + height + '" rx="2" fill="' + colour + '"/>' +
      '</svg>' +
      '<div class="candle-facts">' +
        '<div class="candle-stat"><span>' + t('t1.body') + '</span><b>' + U.pct(s.bodyRatio, 0) + '</b></div>' +
        '<div class="candle-stat"><span>' + t('f.close') + '</span><b>' + U.pct(s.closePos, 0) + ' ' + t('t1.closeOf') + '</b></div>' +
        '<div class="candle-stat"><span>' + t('t1.rangeLabel') + '</span><b>' + U.fmt(s.range) + ' ' + t('t1.pts') + '</b></div>' +
        '<div class="candle-dir ' + (s.bullish ? 'is-bull' : 'is-bear') + '">' +
          (s.bullish ? '▲ ' + t('t1.bullish') : '▼ ' + t('t1.bearish')) + '</div>' +
      '</div>';
    el.hidden = false;
  }

  /* ---------- rendering ---------- */
  var VERDICT_CLASS = { hold: 'v-hold', partial: 'v-partial', book: 'v-book', wait: 'v-wait' };
  var STATUS_ICON = { pass: '✓', warn: '⚠', fail: '✕' };
  var STATUS_KEY = { pass: 't1.pass', warn: 't1.weak', fail: 't1.fail' };

  function render(result) {
    var sideLabel = t(result.side === 'put' ? 't1.putTrade' : 't1.callTrade');

    U.$('t1-verdict').innerHTML = '' +
      '<div class="muted small" style="margin-bottom:12px">' +
        U.escapeHtml(t('t1.assessed', { side: sideLabel })) + '</div>' +
      '<div class="verdict-badge ' + VERDICT_CLASS[result.verdict] + '">' + U.escapeHtml(result.headline) + '</div>' +
      '<p class="verdict-sub">' + U.escapeHtml(result.explain) + '</p>';

    var ratioPct = isFinite(result.rewardRatio) ? U.clamp(result.rewardRatio / 2, 0, 1) * 100 : 0;
    U.$('t1-signal').innerHTML = '' +
      '<div class="card-head"><h3>' + U.escapeHtml(t('t1.signal')) + '</h3></div>' +
      '<div class="signal">' +
        '<div class="signal-row">' +
          '<div class="signal-num"><span>' + U.escapeHtml(t('t1.momentum')) + '</span><b>' + result.momentum + '%</b></div>' +
          '<div class="bar"><i style="width:' + result.momentum + '%"></i></div>' +
        '</div>' +
        '<div class="signal-row">' +
          '<div class="signal-num"><span>' + U.escapeHtml(t('t1.rewardRatio')) +
            (isFinite(result.rewardRatio) ? ' (' + U.fmt(result.rewardRatio) + '×)' : '') +
          '</span><b>' + U.fmt(ratioPct, 0) + '%</b></div>' +
          '<div class="bar"><i style="width:' + ratioPct + '%"></i></div>' +
        '</div>' +
      '</div>';

    U.$('t1-checks').innerHTML = result.checks.map(function (c) {
      return '' +
        '<li class="check ' + c.status + (c.critical ? ' is-critical' : '') + '">' +
          '<span class="check-icon" aria-hidden="true">' + STATUS_ICON[c.status] + '</span>' +
          '<span class="check-body">' +
            '<span class="check-name">' + U.escapeHtml(t('t1.check', { n: c.id })) + ' — ' + U.escapeHtml(c.name) +
              (c.critical ? '<span class="crit-tag">' + U.escapeHtml(t('t1.decisive')) + '</span>' : '') + '</span>' +
            '<span class="check-detail">' + U.escapeHtml(c.detail) + '</span>' +
          '</span>' +
          '<span class="check-verdict">' + U.escapeHtml(t(STATUS_KEY[c.status])) + '</span>' +
        '</li>';
    }).join('');

    var passed = result.check4.status === 'pass';
    U.$('t1-gate').className = 'card gate ' + (passed ? 'pass' : 'fail');
    U.$('t1-gate').innerHTML = '' +
      '<h3>' + U.escapeHtml(t(passed ? 't1.gatePass' : 't1.gateFail')) + '</h3>' +
      '<p class="muted">' + U.escapeHtml(t(passed ? 't1.gatePassText' : 't1.gateFailText')) + '</p>';

    U.$('t1-plan').innerHTML = '' +
      '<div class="card-head"><h3>' + U.escapeHtml(t('t1.plan')) + '</h3></div>' +
      '<ol class="action-plan">' +
        result.plan.map(function (step) { return '<li>' + U.escapeHtml(step) + '</li>'; }).join('') +
      '</ol>';

    U.$('t1-output').hidden = false;
  }

  /* ---------- controller ---------- */
  function setSide(next) {
    side = next === 'put' ? 'put' : 'call';
    U.$$('#panel-t1 .side-btn').forEach(function (btn) {
      var active = btn.getAttribute('data-side') === side;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-checked', active ? 'true' : 'false');
    });
  }

  function run() {
    var cfg = APP.config.get();
    var levels = {
      side: side,
      entry: U.num(U.$('t1-entry').value),
      t1: U.num(U.$('t1-t1').value),
      t2: U.num(U.$('t1-t2').value)
    };

    var levelErrors = [];
    [['entry', 't1.entryLabel'], ['t1', 't1.t1Label'], ['t2', 't1.t2Label']].forEach(function (pair) {
      if (!isFinite(levels[pair[0]]) || levels[pair[0]] <= 0) {
        levelErrors.push(t('t1.err.required', { field: t(pair[1]) }));
      }
    });
    if (!levelErrors.length && !(levels.entry < levels.t1 && levels.t1 < levels.t2)) {
      levelErrors.push(t('t1.err.ladder'));
    }
    U.showErrors('t1-levels-err', levelErrors);

    var candle = U.readCandle('t1');
    var candleErrors = U.validateCandle(candle, t('v.t1candle'), 't1');
    U.showErrors('t1-candle-err', candleErrors);

    if (levelErrors.length || candleErrors.length) {
      U.$('t1-output').hidden = true;
      return null;
    }

    var result = decide(levels, candle, cfg);
    APP.state.t1 = result;
    render(result);
    return result;
  }

  function reset() {
    ['t1-entry', 't1-t1', 't1-t2'].forEach(function (id) { U.$(id).value = ''; });
    U.clearCandle('t1');
    U.showErrors('t1-levels-err', []);
    U.showErrors('t1-candle-err', []);
    U.$('t1-output').hidden = true;
    renderPreview();
    renderReading();
    APP.state.t1 = null;
  }

  function loadSample() {
    setSide('call');
    U.$('t1-entry').value = '152';
    U.$('t1-t1').value = '175';
    U.$('t1-t2').value = '198';
    U.writeCandle('t1', { o: 172, h: 181, l: 165, c: 180 });
    renderPreview();
    renderReading();
    run();
  }

  /* Steps 6–7: pull the analyser output across with the guide's mapping. */
  function importFromAnalyser(which) {
    var a = APP.state.analyser;
    if (!a) return;
    var r = which === 'put' ? a.pe : a.ce;
    setSide(which);
    U.$('t1-entry').value = r.stopLoss.toFixed(2);   // entry field  <- stop loss
    U.$('t1-t1').value = r.entry.toFixed(2);         // T1 level     <- entry price
    U.$('t1-t2').value = r.target1.toFixed(2);       // T2 level     <- Target 1
    U.showErrors('t1-levels-err', []);
    renderReading();
    U.$('t1-output').hidden = true;
    APP.tabs.show('t1');
    U.$('t1-o').focus();
  }

  function init() {
    U.$$('#panel-t1 .side-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setSide(btn.getAttribute('data-side'));
        if (APP.state.t1) run();
      });
    });
    U.$('btn-decide').addEventListener('click', run);
    U.$('btn-t1-reset').addEventListener('click', reset);
    U.$('btn-t1-sample').addEventListener('click', loadSample);
    U.$$('#panel-t1 input').forEach(function (input) {
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    });
    U.$$('#panel-t1 .ohlc input').forEach(function (input) {
      input.addEventListener('input', renderPreview);
    });
    ['t1-entry', 't1-t1', 't1-t2'].forEach(function (id) {
      U.$(id).addEventListener('input', renderReading);
    });
  }

  APP.t1helper = {
    init: init, run: run, reset: reset, decide: decide,
    importFromAnalyser: importFromAnalyser, renderPreview: renderPreview,
    renderReading: renderReading
  };
})(window.APP);
</script>
<script>
/* Tool 3 — Stoploss Pullback Entry (Phase 4, steps 11–13).

   Input : the original 09:15–09:20 call and put candles.
   Output: the side to trade (call buy / put buy), zone 1 as the entry price
           and Target 1. No stop loss is produced — the setup is structural. */
(function (APP) {
  'use strict';

  var U = APP.util;
  function t(key, vars) { return APP.i18n.t(key, vars); }

  function scoreSide(candle, combinedRange) {
    var s = U.candleStats(candle);
    var relRange = combinedRange > 0 ? s.range / combinedRange : 0.5;
    /* Liquidity score: where the candle closed matters most, then how much of
       the range was body, then direction, then how much of the session's early
       movement this side actually captured. */
    var score = U.clamp(
      0.45 * s.closePos + 0.30 * s.bodyRatio + 0.15 * (s.bullish ? 1 : 0) + 0.10 * relRange,
      0, 1
    );
    return { stats: s, relRange: relRange, score: score };
  }

  function levelsFor(candle, cfg) {
    var range = candle.h - candle.l;
    return {
      zone1: U.toTick(candle.l + cfg.zone1Retrace * range, cfg.tickSize),
      zone2: U.toTick(candle.l + cfg.zone2Retrace * range, cfg.tickSize),
      target1: U.toTick(candle.h + cfg.pullbackTargetMult * range, cfg.tickSize),
      range: range
    };
  }

  function analyse(ceCandle, peCandle, cfg) {
    var combined = (ceCandle.h - ceCandle.l) + (peCandle.h - peCandle.l);
    var ce = scoreSide(ceCandle, combined);
    var pe = scoreSide(peCandle, combined);

    var side = ce.score >= pe.score ? 'call' : 'put';
    var chosenCandle = side === 'call' ? ceCandle : peCandle;
    var margin = Math.abs(ce.score - pe.score);

    return {
      side: side,
      margin: margin,
      confidence: margin < 0.05 ? 'low' : (margin < 0.15 ? 'moderate' : 'high'),
      ce: ce,
      pe: pe,
      ceCandle: ceCandle,
      peCandle: peCandle,
      levels: levelsFor(chosenCandle, cfg),
      chosenCandle: chosenCandle
    };
  }

  /* ---------- rendering ---------- */
  function render(result) {
    var isCall = result.side === 'call';

    U.$('pb-verdict').innerHTML = '' +
      '<div class="muted small" style="margin-bottom:12px">' + U.escapeHtml(t('pb.recommended')) + '</div>' +
      '<div class="pb-side ' + (isCall ? 'pb-call' : 'pb-put') + '">' +
        U.escapeHtml(t(isCall ? 'pb.callBuy' : 'pb.putBuy')) + '</div>' +
      '<p class="verdict-sub">' + U.escapeHtml(t('pb.reason', {
        leg: t(isCall ? 'f.call' : 'f.put'),
        win: U.pct(isCall ? result.ce.score : result.pe.score, 0),
        lose: U.pct(isCall ? result.pe.score : result.ce.score, 0),
        confidence: t('pb.conf.' + result.confidence)
      })) + '</p>';

    U.$('pb-levels').innerHTML = '' +
      '<div class="card-head"><h3><span class="step-pill">' + U.escapeHtml(t('pb.step13')) + '</span> ' +
        U.escapeHtml(t('pb.levels')) + '</h3>' +
      '<p class="muted">' + U.escapeHtml(t('pb.levelsDesc')) + '</p></div>' +
      '<div class="zone-grid">' +
        '<div class="zone zone-1"><div class="zone-label">' + U.escapeHtml(t('pb.zone1')) + '</div><div class="zone-value">' +
          U.fmt(result.levels.zone1) + '</div><div class="zone-note">' + U.escapeHtml(t('pb.zone1Note')) + '</div></div>' +
        '<div class="zone zone-2"><div class="zone-label">' + U.escapeHtml(t('pb.zone2')) + '</div><div class="zone-value">' +
          U.fmt(result.levels.zone2) + '</div><div class="zone-note">' + U.escapeHtml(t('pb.zone2Note')) + '</div></div>' +
        '<div class="zone zone-t"><div class="zone-label">' + U.escapeHtml(t('pb.target')) + '</div><div class="zone-value">' +
          U.fmt(result.levels.target1) + '</div><div class="zone-note">' + U.escapeHtml(t('pb.targetNote')) + '</div></div>' +
      '</div>' +
      '<p class="no-sl">' + U.escapeHtml(t('pb.noSl')) + '</p>';

    function row(name, ceVal, peVal, ceWins) {
      return '<tr><td>' + U.escapeHtml(name) + '</td>' +
        '<td class="' + (ceWins === true ? 'win' : '') + '">' + ceVal + '</td>' +
        '<td class="' + (ceWins === false ? 'win' : '') + '">' + peVal + '</td></tr>';
    }
    var c = result.ce, p = result.pe;

    U.$('pb-detail').innerHTML = '' +
      '<div class="card-head"><h3>' + U.escapeHtml(t('pb.compare')) + '</h3>' +
      '<p class="muted">' + U.escapeHtml(t('pb.compareDesc')) + '</p></div>' +
      '<div class="table-scroll"><table class="compare">' +
        '<thead><tr><th>' + U.escapeHtml(t('pb.measure')) + '</th><th>' + U.escapeHtml(t('pb.colCall')) +
          '</th><th>' + U.escapeHtml(t('pb.colPut')) + '</th></tr></thead><tbody>' +
        row(t('pb.rRange'), U.fmt(c.stats.range), U.fmt(p.stats.range), c.stats.range > p.stats.range) +
        row(t('pb.rClose'), U.pct(c.stats.closePos), U.pct(p.stats.closePos), c.stats.closePos > p.stats.closePos) +
        row(t('pb.rBody'), U.pct(c.stats.bodyRatio), U.pct(p.stats.bodyRatio), c.stats.bodyRatio > p.stats.bodyRatio) +
        row(t('pb.rDirection'), t(c.stats.bullish ? 'pb.bullish' : 'pb.bearish'),
            t(p.stats.bullish ? 'pb.bullish' : 'pb.bearish'),
            c.stats.bullish === p.stats.bullish ? null : c.stats.bullish) +
        row(t('pb.rShare'), U.pct(c.relRange), U.pct(p.relRange), c.relRange > p.relRange) +
        row(t('pb.rScore'), U.pct(c.score, 0), U.pct(p.score, 0), c.score >= p.score) +
        '</tbody></table></div>';

    U.$('pullback-output').hidden = false;
  }

  /* ---------- controller ---------- */
  function run() {
    var cfg = APP.config.get();
    var ce = U.readCandle('pb-ce');
    var pe = U.readCandle('pb-pe');

    var ceErrors = U.validateCandle(ce, t('v.call'), 'pb-ce');
    var peErrors = U.validateCandle(pe, t('v.put'), 'pb-pe');
    U.showErrors('pb-ce-err', ceErrors);
    U.showErrors('pb-pe-err', peErrors);

    if (ceErrors.length || peErrors.length) {
      U.$('pullback-output').hidden = true;
      return null;
    }

    var result = analyse(ce, pe, cfg);
    APP.state.pullback = result;
    render(result);
    return result;
  }

  function reset() {
    U.clearCandle('pb-ce');
    U.clearCandle('pb-pe');
    U.showErrors('pb-ce-err', []);
    U.showErrors('pb-pe-err', []);
    U.$('pullback-output').hidden = true;
    APP.state.pullback = null;
  }

  /* Step 11 reuses the very same candles typed into the analyser. */
  function importFromAnalyser() {
    var a = APP.state.analyser;
    if (a) {
      U.writeCandle('pb-ce', a.ce.candle);
      U.writeCandle('pb-pe', a.pe.candle);
    } else {
      U.writeCandle('pb-ce', U.readCandle('an-ce'));
      U.writeCandle('pb-pe', U.readCandle('an-pe'));
    }
    U.showErrors('pb-ce-err', []);
    U.showErrors('pb-pe-err', []);
    run();
  }

  function init() {
    U.$('btn-pullback').addEventListener('click', run);
    U.$('btn-pb-reset').addEventListener('click', reset);
    U.$('btn-pb-import').addEventListener('click', importFromAnalyser);
    U.$$('#panel-pullback input').forEach(function (input) {
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    });
  }

  APP.pullback = {
    init: init, run: run, reset: reset, analyse: analyse,
    importFromAnalyser: importFromAnalyser
  };
})(window.APP);
</script>
<script>
/* Tool 4 — Trade Signal (market-standard confluence, win estimate, expected
   profit and the full metric set).

   Everything here is computed from values you type. The app has no market
   data feed, so the indicator readings come from your chart: leave any of
   them blank and that check is skipped rather than guessed at. */
(function (APP) {
  'use strict';

  var U = APP.util;
  var side = 'call';

  function t(key, vars) { return APP.i18n.t(key, vars); }
  function money(n) { return '₹' + U.fmt(n); }
  function money0(n) { return '₹' + U.fmt(n, 0); }

  /* ---------- confluence: the market-standard filters ---------- */
  function confluence(inp, cfg, isCall) {
    var checks = [];

    function add(id, name, weight, state, detail) {
      checks.push({ id: id, name: name, weight: weight, state: state, detail: detail });
    }

    /* 1. Price vs VWAP — the intraday fair-value line. */
    if (isFinite(inp.spot) && isFinite(inp.vwap)) {
      var vwapOk = isCall ? inp.spot > inp.vwap : inp.spot < inp.vwap;
      add('vwap', t('sg.c.vwap'), 20, vwapOk ? 'pass' : 'fail',
        t(vwapOk ? 'sg.c.vwapOk' : 'sg.c.vwapNo', {
          spot: U.fmt(inp.spot, 2), vwap: U.fmt(inp.vwap, 2),
          gap: U.fmt(Math.abs(inp.spot - inp.vwap), 2)
        }));
    } else {
      add('vwap', t('sg.c.vwap'), 20, 'skip', t('sg.c.skip'));
    }

    /* 2. Moving-average alignment. */
    if (isFinite(inp.spot) && isFinite(inp.ema20)) {
      var emaOk = isCall ? inp.spot > inp.ema20 : inp.spot < inp.ema20;
      if (isFinite(inp.ema50)) {
        emaOk = emaOk && (isCall ? inp.ema20 >= inp.ema50 : inp.ema20 <= inp.ema50);
      }
      add('ema', t('sg.c.ema'), 15, emaOk ? 'pass' : 'fail',
        t(emaOk ? 'sg.c.emaOk' : 'sg.c.emaNo', {
          spot: U.fmt(inp.spot, 2), ema20: U.fmt(inp.ema20, 2),
          ema50: isFinite(inp.ema50) ? U.fmt(inp.ema50, 2) : '—'
        }));
    } else {
      add('ema', t('sg.c.ema'), 15, 'skip', t('sg.c.skip'));
    }

    /* 3. RSI regime — momentum present, but not already exhausted. */
    if (isFinite(inp.rsi)) {
      var lo = isCall ? cfg.rsiMin : 100 - cfg.rsiMax;
      var hi = isCall ? cfg.rsiMax : 100 - cfg.rsiMin;
      var rsiOk = inp.rsi >= lo && inp.rsi <= hi;
      add('rsi', t('sg.c.rsi'), 15, rsiOk ? 'pass' : 'fail',
        t(rsiOk ? 'sg.c.rsiOk' : 'sg.c.rsiNo', {
          rsi: U.fmt(inp.rsi, 1), lo: U.fmt(lo, 0), hi: U.fmt(hi, 0)
        }));
    } else {
      add('rsi', t('sg.c.rsi'), 15, 'skip', t('sg.c.skip'));
    }

    /* 4. Volume confirmation on the breakout candle. */
    if (isFinite(inp.volRatio)) {
      var volOk = inp.volRatio >= cfg.volumeMin;
      add('volume', t('sg.c.volume'), 10, volOk ? 'pass' : 'fail',
        t(volOk ? 'sg.c.volumeOk' : 'sg.c.volumeNo', {
          ratio: U.fmt(inp.volRatio, 2), min: U.fmt(cfg.volumeMin, 2)
        }));
    } else {
      add('volume', t('sg.c.volume'), 10, 'skip', t('sg.c.skip'));
    }

    /* 5. Volatility regime — India VIX. */
    if (isFinite(inp.vix)) {
      var vixOk = inp.vix <= cfg.vixMax;
      add('vix', t('sg.c.vix'), 10, vixOk ? 'pass' : 'fail',
        t(vixOk ? 'sg.c.vixOk' : 'sg.c.vixNo', { vix: U.fmt(inp.vix, 2), max: U.fmt(cfg.vixMax, 0) }));
    } else {
      add('vix', t('sg.c.vix'), 10, 'skip', t('sg.c.skip'));
    }

    /* 6. Is the target actually reachable in the day's range? */
    if (isFinite(inp.refRange) && inp.refRange > 0 && isFinite(inp.t2) && isFinite(inp.entry)) {
      var reach = (inp.t2 - inp.entry) / inp.refRange;
      var reachOk = reach <= cfg.atrReachMax;
      add('reach', t('sg.c.reach'), 15, reachOk ? 'pass' : 'fail',
        t(reachOk ? 'sg.c.reachOk' : 'sg.c.reachNo', {
          reach: U.fmt(reach, 2), max: U.fmt(cfg.atrReachMax, 2), range: U.fmt(inp.refRange)
        }));
    } else {
      add('reach', t('sg.c.reach'), 15, 'skip', t('sg.c.skip'));
    }

    /* 7. Risk:reward gate. */
    var risk = inp.entry - inp.sl;
    var reward = inp.t2 - inp.entry;
    if (risk > 0 && reward > 0) {
      var rr = reward / risk;
      var rrOk = rr >= cfg.minRR;
      add('rr', t('sg.c.rr'), 15, rrOk ? 'pass' : 'fail',
        t(rrOk ? 'sg.c.rrOk' : 'sg.c.rrNo', { rr: U.fmt(rr, 2), min: U.fmt(cfg.minRR, 2) }));
    } else {
      add('rr', t('sg.c.rr'), 15, 'skip', t('sg.c.skip'));
    }

    /* 8. Time of day — avoid the midday chop and the closing scramble. */
    if (isFinite(inp.minuteOfDay)) {
      var m = inp.minuteOfDay;
      var early = m < 9 * 60 + 20;
      var chop = m >= 11 * 60 + 30 && m < 13 * 60;
      var late = m > 14 * 60 + 45;
      var timeOk = !early && !chop && !late;
      add('time', t('sg.c.time'), 10, timeOk ? 'pass' : 'fail',
        t(timeOk ? 'sg.c.timeOk' : (early ? 'sg.c.timeEarly' : (chop ? 'sg.c.timeChop' : 'sg.c.timeLate')),
          { time: inp.timeText }));
    } else {
      add('time', t('sg.c.time'), 10, 'skip', t('sg.c.skip'));
    }

    /* 9. The T1 Decision Helper's own read, when one has been run. */
    if (APP.state.t1) {
      var mom = APP.state.t1.momentum;
      var momOk = mom >= cfg.holdThreshold;
      add('helper', t('sg.c.helper'), 20, momOk ? 'pass' : 'fail',
        t(momOk ? 'sg.c.helperOk' : 'sg.c.helperNo', { momentum: mom, min: cfg.holdThreshold }));
    } else {
      add('helper', t('sg.c.helper'), 20, 'skip', t('sg.c.skipHelper'));
    }

    var earned = 0, available = 0, total = 0, used = 0;
    checks.forEach(function (c) {
      total += c.weight;
      if (c.state === 'skip') return;
      available += c.weight;
      used += 1;
      if (c.state === 'pass') earned += c.weight;
    });

    return {
      checks: checks,
      score: available > 0 ? (earned / available) * 100 : NaN,
      used: used,
      count: checks.length,
      coverage: total > 0 ? available / total : 0
    };
  }

  /* ---------- money, risk and expectancy ---------- */
  function metrics(inp, cfg, winPct) {
    var qty = inp.lots * cfg.lotSize;
    var costs = inp.lots * cfg.costPerLot;

    var riskPts = inp.entry - inp.sl;
    var rewardPts = inp.t2 - inp.entry;
    var rewardT1Pts = inp.t1 - inp.entry;

    var capital = inp.entry * qty;
    var maxLoss = riskPts * qty + costs;
    var profitT1 = rewardT1Pts * qty - costs;
    var profitT2 = rewardPts * qty - costs;

    /* The honest benchmark: below this win rate the setup loses money
       however good the story around it sounds. */
    var breakeven = (riskPts + rewardPts) > 0 ? riskPts / (riskPts + rewardPts) * 100 : NaN;

    var p = winPct / 100;
    var ev = p * profitT2 - (1 - p) * maxLoss;
    var evPerRisk = maxLoss > 0 ? ev / maxLoss : NaN;

    /* Kelly on the net payoff ratio, reported at quarter size — full Kelly is
       far too aggressive for a single intraday setup. */
    var payoff = maxLoss > 0 ? profitT2 / maxLoss : NaN;
    var kelly = isFinite(payoff) && payoff > 0 ? (p * payoff - (1 - p)) / payoff : NaN;

    var riskPerLot = riskPts * cfg.lotSize + cfg.costPerLot;
    var allowedRisk = isFinite(inp.account) ? inp.account * (cfg.riskPctOfAccount / 100) : NaN;
    var suggestedLots = isFinite(allowedRisk) && riskPerLot > 0
      ? Math.max(0, Math.floor(allowedRisk / riskPerLot)) : NaN;

    return {
      qty: qty, costs: costs, capital: capital,
      riskPts: riskPts, rewardPts: rewardPts, rewardT1Pts: rewardT1Pts,
      maxLoss: maxLoss, profitT1: profitT1, profitT2: profitT2,
      rr: riskPts > 0 ? rewardPts / riskPts : NaN,
      rrT1: riskPts > 0 ? rewardT1Pts / riskPts : NaN,
      breakeven: breakeven,
      ev: ev, evPerRisk: evPerRisk,
      kellyQuarter: isFinite(kelly) ? U.clamp(kelly / 4, 0, 0.25) : NaN,
      riskOfAccount: isFinite(inp.account) && inp.account > 0 ? maxLoss / inp.account * 100 : NaN,
      suggestedLots: suggestedLots
    };
  }

  function evaluate(inp, cfg, tradeSide) {
    var isCall = tradeSide === 'call';
    var conf = confluence(inp, cfg, isCall);

    /* The win estimate is your own base rate nudged by how much confluence
       lined up — not a backtested probability. */
    var score = isFinite(conf.score) ? conf.score : 50;
    var winPct = U.clamp(
      cfg.baseWinRate + (score - 50) * cfg.winSensitivity,
      cfg.winFloor, cfg.winCeiling
    );

    var m = metrics(inp, cfg, winPct);

    var verdict, headline;
    if (!(m.ev > 0) || !(winPct > m.breakeven)) {
      verdict = 'skip';
      headline = t('sg.skip');
    } else if (score >= cfg.takeThreshold) {
      verdict = 'take';
      headline = t('sg.take');
    } else {
      verdict = 'caution';
      headline = t('sg.caution');
    }

    return {
      side: tradeSide, inputs: inp, conf: conf, score: score,
      winPct: winPct, m: m, verdict: verdict, headline: headline,
      edge: winPct - m.breakeven
    };
  }

  /* ---------- rendering ---------- */
  var VERDICT_CLASS = { take: 'v-hold', caution: 'v-partial', skip: 'v-book' };
  var STATE_ICON = { pass: '✓', fail: '✕', skip: '–' };

  function tile(label, value, cls) {
    return '<div class="metric-tile ' + (cls || '') + '">' +
      '<div class="tile-label">' + U.escapeHtml(label) + '</div>' +
      '<div class="tile-value">' + value + '</div></div>';
  }

  function render(r) {
    var m = r.m;
    var sideLabel = t(r.side === 'put' ? 'sg.putTrade' : 'sg.callTrade');

    U.$('sg-verdict').innerHTML = '' +
      '<div class="muted small" style="margin-bottom:12px">' + U.escapeHtml(sideLabel) + '</div>' +
      '<div class="verdict-badge ' + VERDICT_CLASS[r.verdict] + '">' + U.escapeHtml(r.headline) + '</div>' +
      '<p class="verdict-sub">' + U.escapeHtml(t('sg.' + r.verdict + 'Text', {
        score: U.fmt(r.score, 0),
        win: U.fmt(r.winPct, 0),
        breakeven: U.fmt(m.breakeven, 0),
        ev: money0(m.ev)
      })) + '</p>';

    U.$('sg-tiles').innerHTML = '' +
      '<div class="tile-grid">' +
        tile(t('sg.winEstimate'), U.fmt(r.winPct, 0) + '%', 'tile-primary') +
        tile(t('sg.expectedProfit'), money0(m.profitT2), m.profitT2 > 0 ? 'tile-good' : 'tile-bad') +
        tile(t('sg.expectedValue'), money0(m.ev), m.ev > 0 ? 'tile-good' : 'tile-bad') +
        tile(t('sg.breakevenWin'), U.fmt(m.breakeven, 0) + '%', '') +
      '</div>' +
      '<p class="edge-note ' + (r.edge > 0 ? 'is-good' : 'is-bad') + '">' +
        U.escapeHtml(t(r.edge > 0 ? 'sg.edgeGood' : 'sg.edgeBad', {
          edge: U.fmt(Math.abs(r.edge), 1)
        })) + '</p>';

    U.$('sg-checks').innerHTML = r.conf.checks.map(function (c) {
      return '<li class="check ' + c.state + '">' +
        '<span class="check-icon" aria-hidden="true">' + STATE_ICON[c.state] + '</span>' +
        '<span class="check-body">' +
          '<span class="check-name">' + U.escapeHtml(c.name) +
            '<span class="weight-tag">' + c.weight + '</span></span>' +
          '<span class="check-detail">' + U.escapeHtml(c.detail) + '</span>' +
        '</span>' +
        '<span class="check-verdict">' + U.escapeHtml(t('sg.state.' + c.state)) + '</span>' +
      '</li>';
    }).join('');

    U.$('sg-conf-head').innerHTML = '' +
      '<div class="signal-num"><span>' + U.escapeHtml(t('sg.confluence')) + '</span><b>' +
        U.fmt(r.score, 0) + '%</b></div>' +
      '<div class="bar"><i style="width:' + U.clamp(r.score, 0, 100) + '%"></i></div>' +
      '<p class="muted small" style="margin-top:8px">' +
        U.escapeHtml(t('sg.coverage', { used: r.conf.used, total: r.conf.count })) + '</p>';

    function row(label, value) {
      return '<tr><td>' + U.escapeHtml(label) + '</td><td>' + value + '</td></tr>';
    }
    U.$('sg-metrics').innerHTML = '' +
      '<div class="card-head"><h3>' + U.escapeHtml(t('sg.metrics')) + '</h3></div>' +
      '<div class="table-scroll"><table class="compare metrics-table"><tbody>' +
        row(t('sg.m.qty'), U.fmt(m.qty, 0)) +
        row(t('sg.m.capital'), money0(m.capital)) +
        row(t('sg.m.riskPts'), U.fmt(m.riskPts) + ' / ' + U.fmt(m.rewardPts)) +
        row(t('sg.m.maxLoss'), '<span class="neg">' + money0(m.maxLoss) + '</span>') +
        row(t('sg.m.profitT1'), money0(m.profitT1)) +
        row(t('sg.m.profitT2'), '<span class="pos">' + money0(m.profitT2) + '</span>') +
        row(t('sg.m.rr'), '1 : ' + U.fmt(m.rr, 2) + '  (T1 1 : ' + U.fmt(m.rrT1, 2) + ')') +
        row(t('sg.m.costs'), money0(m.costs)) +
        row(t('sg.m.evPerRisk'), U.fmt(m.evPerRisk, 2) + '×') +
        row(t('sg.m.riskOfAccount'), isFinite(m.riskOfAccount) ? U.fmt(m.riskOfAccount, 2) + '%' : '—') +
        row(t('sg.m.suggestedLots'), isFinite(m.suggestedLots) ? U.fmt(m.suggestedLots, 0) : '—') +
        row(t('sg.m.kelly'), isFinite(m.kellyQuarter) ? U.pct(m.kellyQuarter, 1) : '—') +
      '</tbody></table></div>' +
      '<p class="muted small" style="margin-top:10px">' + U.escapeHtml(t('sg.metricsNote')) + '</p>';

    U.$('signal-output').hidden = false;
  }

  /* ---------- controller ---------- */
  function setSide(next) {
    side = next === 'put' ? 'put' : 'call';
    U.$$('#panel-signal .side-btn').forEach(function (btn) {
      var active = btn.getAttribute('data-side') === side;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-checked', active ? 'true' : 'false');
    });
  }

  function readInputs() {
    var timeText = U.$('sg-time').value;
    var minuteOfDay = NaN;
    if (/^\d{1,2}:\d{2}/.test(timeText)) {
      var parts = timeText.split(':');
      minuteOfDay = Number(parts[0]) * 60 + Number(parts[1]);
    }
    return {
      entry: U.num(U.$('sg-entry').value),
      sl: U.num(U.$('sg-sl').value),
      t1: U.num(U.$('sg-t1').value),
      t2: U.num(U.$('sg-t2').value),
      spot: U.num(U.$('sg-spot').value),
      vwap: U.num(U.$('sg-vwap').value),
      ema20: U.num(U.$('sg-ema20').value),
      ema50: U.num(U.$('sg-ema50').value),
      rsi: U.num(U.$('sg-rsi').value),
      volRatio: U.num(U.$('sg-vol').value),
      vix: U.num(U.$('sg-vix').value),
      refRange: U.num(U.$('sg-range').value),
      lots: Math.max(1, Math.round(U.num(U.$('sg-lots').value)) || 1),
      account: U.num(U.$('sg-account').value),
      timeText: timeText,
      minuteOfDay: minuteOfDay
    };
  }

  function run() {
    var cfg = APP.config.get();
    var inp = readInputs();

    var errors = [];
    [['entry', 'sg.entry'], ['sl', 'sg.sl'], ['t1', 'sg.t1'], ['t2', 'sg.t2']].forEach(function (pair) {
      if (!isFinite(inp[pair[0]]) || inp[pair[0]] <= 0) {
        errors.push(t('t1.err.required', { field: t(pair[1]) }));
      }
    });
    if (!errors.length && !(inp.sl < inp.entry && inp.entry < inp.t1 && inp.t1 <= inp.t2)) {
      errors.push(t('sg.err.ladder'));
    }
    U.showErrors('sg-err', errors);
    if (errors.length) {
      U.$('signal-output').hidden = true;
      APP.state.signal = null;
      return null;
    }

    var result = evaluate(inp, cfg, side);
    APP.state.signal = result;
    render(result);
    APP.alerts.onSignal(result);
    return result;
  }

  function reset() {
    ['sg-entry', 'sg-sl', 'sg-t1', 'sg-t2', 'sg-spot', 'sg-vwap', 'sg-ema20',
     'sg-ema50', 'sg-rsi', 'sg-vol', 'sg-vix', 'sg-range', 'sg-account'
    ].forEach(function (id) { U.$(id).value = ''; });
    U.$('sg-lots').value = '1';
    U.showErrors('sg-err', []);
    U.$('signal-output').hidden = true;
    APP.state.signal = null;
  }

  /* Carry the levels across: the analyser gives entry/SL/T1, and the T1 helper
     ladder gives T2. Falls back to the analyser's own Target 1 for T2. */
  function importLevels(which) {
    var a = APP.state.analyser;
    if (!a) return;
    var r = which === 'put' ? a.pe : a.ce;
    setSide(which);
    U.$('sg-entry').value = r.entry.toFixed(2);
    U.$('sg-sl').value = r.stopLoss.toFixed(2);
    U.$('sg-t1').value = r.target1.toFixed(2);
    U.$('sg-t2').value = (r.target1 + r.range).toFixed(2);
    U.$('sg-range').value = r.range.toFixed(2);
    U.showErrors('sg-err', []);
  }

  function fillTimeNow() {
    var now = new Date();
    U.$('sg-time').value =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  function loadSample() {
    setSide('call');
    U.$('sg-entry').value = '162.75';
    U.$('sg-sl').value = '141.20';
    U.$('sg-t1').value = '184.30';
    U.$('sg-t2').value = '205.85';
    U.$('sg-range').value = '21.55';
    U.$('sg-spot').value = '23712.40';
    U.$('sg-vwap').value = '23680.10';
    U.$('sg-ema20').value = '23668.75';
    U.$('sg-ema50').value = '23640.00';
    U.$('sg-rsi').value = '63.4';
    U.$('sg-vol').value = '1.65';
    U.$('sg-vix').value = '13.8';
    U.$('sg-lots').value = '2';
    U.$('sg-account').value = '200000';
    U.$('sg-time').value = '09:35';
    run();
  }

  function init() {
    U.$$('#panel-signal .side-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setSide(btn.getAttribute('data-side'));
        if (APP.state.signal) run();
      });
    });
    U.$('btn-signal').addEventListener('click', run);
    U.$('btn-sg-reset').addEventListener('click', reset);
    U.$('btn-sg-sample').addEventListener('click', loadSample);
    U.$('btn-sg-now').addEventListener('click', fillTimeNow);
    U.$('btn-sg-import-call').addEventListener('click', function () { importLevels('call'); });
    U.$('btn-sg-import-put').addEventListener('click', function () { importLevels('put'); });
    U.$$('#panel-signal input').forEach(function (input) {
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    });
  }

  APP.signal = {
    init: init, run: run, reset: reset,
    evaluate: evaluate, confluence: confluence, metrics: metrics
  };
})(window.APP);
</script>
<script>
/* Notifications and the 5-minute candle-close scheduler.

   Two honest limits, stated in the UI as well: the page must stay open for a
   reminder to fire, and system notifications only appear once the browser has
   granted permission. When either is unavailable everything still works — the
   alert lands in the in-page log instead. */
(function (APP) {
  'use strict';

  var U = APP.util;
  function t(key, vars) { return APP.i18n.t(key, vars); }

  var timer = null;
  var fired = 0;
  var log = [];

  function supported() { return typeof window.Notification !== 'undefined'; }
  function permission() { return supported() ? window.Notification.permission : 'unsupported'; }

  /* ---------- next 5-minute boundary, plus a second of settle time ---------- */
  function nextBoundary(from, minutes) {
    var step = (minutes || 5) * 60000;
    var base = from ? from.getTime() : Date.now();
    var next = Math.ceil((base + 1000) / step) * step;
    return new Date(next + 1000);
  }

  function clockText(date) {
    return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
  }

  /* ---------- delivery ---------- */
  function push(title, body, tag) {
    log.unshift({ time: clockText(new Date()), title: title, body: body });
    if (log.length > 12) log.pop();
    renderLog();

    if (supported() && window.Notification.permission === 'granted') {
      try {
        new window.Notification(title, { body: body, tag: tag || 'nifty-suite', lang: APP.i18n.get() });
      } catch (e) { /* some browsers require a service worker; the log still has it */ }
    }
  }

  /* ---------- signal notification ---------- */
  function signalText(result) {
    var m = result.m;
    return t('al.signalBody', {
      entry: '₹' + U.fmt(result.inputs.entry),
      sl: '₹' + U.fmt(result.inputs.sl),
      t2: '₹' + U.fmt(result.inputs.t2),
      win: U.fmt(result.winPct, 0),
      profit: '₹' + U.fmt(m.profitT2, 0),
      ev: '₹' + U.fmt(m.ev, 0),
      rr: U.fmt(m.rr, 2)
    });
  }

  function onSignal(result) {
    if (!U.$('al-auto').checked) return;
    var sideLabel = t(result.side === 'put' ? 'sg.putTrade' : 'sg.callTrade');
    push(result.headline + ' — ' + sideLabel, signalText(result), 'signal');
  }

  function notifyNow() {
    var result = APP.state.signal;
    if (!result) { push(t('al.noSignal'), t('al.noSignalBody'), 'signal'); return; }
    var sideLabel = t(result.side === 'put' ? 'sg.putTrade' : 'sg.callTrade');
    push(result.headline + ' — ' + sideLabel, signalText(result), 'signal');
  }

  /* ---------- candle-close reminders ---------- */
  function schedule() {
    var due = nextBoundary();
    U.$('al-next').textContent = t('al.nextAt', { time: clockText(due) });
    timer = window.setTimeout(function () {
      fired += 1;
      var result = APP.state.signal;
      var body = result
        ? t('al.candleBodyLevels', { entry: '₹' + U.fmt(result.inputs.entry), t1: '₹' + U.fmt(result.inputs.t1) })
        : t('al.candleBody');
      push(t('al.candleTitle', { time: clockText(new Date()) }), body, 'candle');

      var limit = Number(U.$('al-count').value) || 0;
      if (limit > 0 && fired >= limit) { stop(); return; }
      schedule();
    }, Math.max(1000, due.getTime() - Date.now()));
  }

  function start() {
    if (timer) return;
    fired = 0;
    U.$('btn-al-start').hidden = true;
    U.$('btn-al-stop').hidden = false;
    schedule();
  }

  function stop() {
    if (timer) { window.clearTimeout(timer); timer = null; }
    U.$('btn-al-start').hidden = false;
    U.$('btn-al-stop').hidden = true;
    U.$('al-next').textContent = t('al.stopped');
  }

  /* ---------- permission ---------- */
  function renderPermission() {
    var state = permission();
    var el = U.$('al-permission');
    el.className = 'perm perm-' + state;
    el.textContent = t('al.perm.' + state);
    U.$('btn-al-enable').hidden = (state === 'granted' || state === 'unsupported');
  }

  function requestPermission() {
    if (!supported()) { renderPermission(); return; }
    try {
      var res = window.Notification.requestPermission(function () { renderPermission(); });
      if (res && typeof res.then === 'function') res.then(renderPermission).catch(renderPermission);
    } catch (e) {
      renderPermission();
    }
  }

  /* ---------- log ---------- */
  function renderLog() {
    var el = U.$('al-log');
    if (!log.length) {
      el.innerHTML = '<li class="log-empty muted small">' + U.escapeHtml(t('al.logEmpty')) + '</li>';
      return;
    }
    el.innerHTML = log.map(function (entry) {
      return '<li class="log-item">' +
        '<span class="log-time">' + U.escapeHtml(entry.time) + '</span>' +
        '<span class="log-body"><b>' + U.escapeHtml(entry.title) + '</b>' +
          '<span>' + U.escapeHtml(entry.body) + '</span></span>' +
      '</li>';
    }).join('');
  }

  function init() {
    U.$('btn-al-enable').addEventListener('click', requestPermission);
    U.$('btn-al-notify').addEventListener('click', notifyNow);
    U.$('btn-al-start').addEventListener('click', start);
    U.$('btn-al-stop').addEventListener('click', stop);
    renderPermission();
    renderLog();
    U.$('al-next').textContent = t('al.stopped');
  }

  APP.alerts = {
    init: init, onSignal: onSignal, notifyNow: notifyNow,
    start: start, stop: stop, nextBoundary: nextBoundary,
    renderLog: renderLog, renderPermission: renderPermission
  };
})(window.APP);
</script>
<script>
/* Bootstrap: shared state, tab routing, language toggle, settings drawer and
   the generated guide / formula reference. */
(function (APP) {
  'use strict';

  APP.state = APP.state || { analyser: null, t1: null, pullback: null, signal: null };

  var U = APP.util;
  function t(key, vars) { return APP.i18n.t(key, vars); }

  /* ---------- tabs ---------- */
  var tabs = {
    show: function (name) {
      U.$$('.tab').forEach(function (tab) {
        var active = tab.getAttribute('data-panel') === name;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      U.$$('.panel').forEach(function (panel) {
        var active = panel.id === 'panel-' + name;
        panel.classList.toggle('is-active', active);
        panel.hidden = !active;
      });
      if (window.location.hash !== '#' + name) {
        try { history.replaceState(null, '', '#' + name); } catch (e) { /* file:// */ }
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };
  APP.tabs = tabs;

  var PANELS = ['analyser', 't1', 'pullback', 'signal', 'guide'];

  function panelFromHash() {
    var hash = (window.location.hash || '').replace('#', '');
    return PANELS.indexOf(hash) !== -1 ? hash : null;
  }

  function initTabs() {
    U.$$('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () { tabs.show(tab.getAttribute('data-panel')); });
    });
    /* A hash-only navigation does not reload the document, so deep links and
       the back button need this as well as the initial read. */
    window.addEventListener('hashchange', function () {
      var name = panelFromHash();
      if (name) tabs.show(name);
    });
    var initial = panelFromHash();
    if (initial) tabs.show(initial);
  }

  /* ---------- settings drawer ---------- */
  var CFG_FIELDS = Object.keys(APP.config.DEFAULTS);

  function fillSettingsInputs() {
    var cfg = APP.config.get();
    CFG_FIELDS.forEach(function (key) {
      var el = U.$('cfg-' + key);
      if (el) el.value = String(cfg[key]);
    });
  }

  function readSettingsInputs() {
    var patch = {};
    CFG_FIELDS.forEach(function (key) {
      var el = U.$('cfg-' + key);
      if (el) patch[key] = U.num(el.value);
    });
    return patch;
  }

  function flash(message) {
    var el = U.$('settings-flash');
    el.textContent = message;
    window.setTimeout(function () { el.textContent = ''; }, 2200);
  }

  /* Re-run whichever tools already have results so edits show up immediately. */
  function recomputeAll() {
    if (APP.state.analyser) APP.analyser.run();
    if (APP.state.t1) APP.t1helper.run();
    if (APP.state.pullback) APP.pullback.run();
    if (APP.state.signal) APP.signal.run();
    APP.t1helper.renderPreview();
    APP.t1helper.renderReading();
    APP.alerts.renderPermission();
    APP.alerts.renderLog();
    renderGuide();
  }

  function initSettings() {
    var drawer = U.$('settings-drawer');
    var toggle = U.$('btn-settings');

    toggle.addEventListener('click', function () {
      var open = drawer.hidden;
      drawer.hidden = !open;
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) fillSettingsInputs();
    });

    U.$('btn-settings-save').addEventListener('click', function () {
      APP.config.save(readSettingsInputs());
      fillSettingsInputs();
      recomputeAll();
      flash(t('cfg.saved'));
    });

    U.$('btn-settings-reset').addEventListener('click', function () {
      APP.config.reset();
      fillSettingsInputs();
      recomputeAll();
      flash(t('cfg.restored'));
    });

    fillSettingsInputs();
  }

  /* ---------- language ---------- */
  function initLanguage() {
    APP.i18n.init();
    U.$('btn-lang').addEventListener('click', function () {
      APP.i18n.set(APP.i18n.get() === 'ta' ? 'en' : 'ta');
    });
    /* Generated markup is not covered by data-i18n, so redraw it on switch. */
    APP.i18n.onChange(function () {
      APP.analyser.renderAtm();
      recomputeAll();
    });
  }

  /* ---------- guide tab ---------- */
  var PHASES = [
    { title: 'g.p1', steps: ['g.p1s1', 'g.p1s2'], start: 1 },
    { title: 'g.p2', steps: ['g.p2s3', 'g.p2s4', 'g.p2s5'], start: 3 },
    { title: 'g.p3', steps: ['g.p3s6', 'g.p3s7', 'g.p3s8', 'g.p3s9', 'g.p3s10'], start: 6 },
    { title: 'g.p4', steps: ['g.p4s11', 'g.p4s12', 'g.p4s13'], start: 11 },
    { title: 'g.p5', steps: ['g.p5s14', 'g.p5s15', 'g.p5s16'], start: 14 }
  ];

  function formulaItems(cfg) {
    var entryTerm = cfg.entryBufferPct ? ' + ' + cfg.entryBufferPct + '% × range' : '';
    var slTerm = cfg.slBufferPct ? ' − ' + cfg.slBufferPct + '% × range' : '';
    return [
      {
        title: 'g.f1', note: 'g.f1n',
        code:
          'range     = high − low\n' +
          'entry     = high' + entryTerm + '\n' +
          'stop loss = low' + slTerm + '\n' +
          'Target 1  = entry + ' + cfg.t1Multiplier + ' × range\n' +
          'confirm   = a 5-min close ≥ entry + ' + cfg.tickSize
      },
      {
        title: 'g.f2', note: 'g.f2n',
        code: 'strength = 50% × close position + 30% × body ÷ range + 20% × (close > open)'
      },
      {
        title: 'g.f3', note: 'g.f3n',
        code:
          'check 1 (40)   direction — candle closed up' +
            (cfg.sideAwareDirection >= 1 ? ' (down on a put trade)' : '') + '\n' +
          'check 2 (15)   body strength — body ÷ range ≥ ' + cfg.bodyStrong + '\n' +
          '        (7.5)   partial credit from ' + cfg.bodyModerate + ' to ' + cfg.bodyStrong + '\n' +
          'check 3 (40)   close position — close ≥ ' + cfg.minClosePos + ' of range\n' +
          'momentum = floor(sum of the weights earned)\n' +
          '\n' +
          'check 4 (gate) T1 breakout — close > T1 level   ← decisive\n' +
          '\n' +
          'verdict = WAIT if check 4 failed, else\n' +
          '          HOLD → T2 at momentum ≥ ' + cfg.holdThreshold + ',\n' +
          '          PARTIAL BOOK at ≥ ' + cfg.partialThreshold + ', otherwise BOOK NOW\n' +
          'reward ratio = (T2 − T1) ÷ (T1 − entry)'
      },
      {
        title: 'g.f4', note: 'g.f4n',
        code:
          'liquidity score = 45% × close position + 30% × body ÷ range\n' +
          '                + 15% × (close > open) + 10% × share of combined range\n' +
          'side     = whichever of CE / PE scores higher\n' +
          'zone 1   = low + ' + cfg.zone1Retrace + ' × range\n' +
          'zone 2   = low + ' + cfg.zone2Retrace + ' × range\n' +
          'Target 1 = high + ' + cfg.pullbackTargetMult + ' × range'
      },
      {
        title: 'g.f5', note: 'g.f5n',
        code:
          'confluence = passed weights ÷ available weights × 100\n' +
          '  VWAP 20 · EMA 15 · RSI 15 · volume 10 · VIX 10\n' +
          '  target reach 15 · risk:reward 15 · time 10 · T1 helper 20\n' +
          '  (a filter left blank is skipped, not counted against you)\n' +
          '\n' +
          'win estimate  = clamp(' + cfg.baseWinRate + ' + (confluence − 50) × ' + cfg.winSensitivity + ',\n' +
          '                      ' + cfg.winFloor + ', ' + cfg.winCeiling + ')\n' +
          'breakeven win = risk ÷ (risk + reward)\n' +
          'expected value = win × profit at T2 − (1 − win) × max loss\n' +
          '\n' +
          'TAKE TRADE  when EV > 0, win > breakeven and confluence ≥ ' + cfg.takeThreshold + '\n' +
          'CAUTION     when EV > 0 and win > breakeven but confluence is short\n' +
          'SKIP        otherwise'
      }
    ];
  }

  function renderGuide() {
    var cfg = APP.config.get();
    var html = PHASES.map(function (phase) {
      var steps = phase.steps.map(function (key) { return '<li>' + t(key) + '</li>'; }).join('');
      return '<h3 class="phase">' + U.escapeHtml(t(phase.title)) + '</h3>' +
             '<ol class="sop" start="' + phase.start + '">' + steps + '</ol>';
    }).join('');

    html += '<h3 class="phase">' + U.escapeHtml(t('g.formulas')) + '</h3>' +
            '<p class="muted small">' + U.escapeHtml(t('g.formulasDesc')) + '</p>' +
            '<div class="formula-list">' +
              formulaItems(cfg).map(function (item) {
                return '<div class="formula"><h4>' + U.escapeHtml(t(item.title)) + '</h4>' +
                       '<code>' + U.escapeHtml(item.code) + '</code>' +
                       '<p>' + U.escapeHtml(t(item.note)) + '</p></div>';
              }).join('') +
            '</div>';

    U.$('guide-body').innerHTML = html;
  }

  /* ---------- clear everything ---------- */
  function initClearAll() {
    U.$('btn-clear-all').addEventListener('click', function () {
      APP.analyser.reset();
      APP.t1helper.reset();
      APP.pullback.reset();
      APP.signal.reset();
      APP.tabs.show('analyser');
    });
  }

  function init() {
    APP.config.load();
    initLanguage();
    initTabs();
    initSettings();
    initClearAll();
    APP.analyser.init();
    APP.autofetch.init();
    APP.t1helper.init();
    APP.pullback.init();
    APP.signal.init();
    APP.alerts.init();
    APP.analyser.renderAtm();
    renderGuide();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window.APP);
</script>
</body>
