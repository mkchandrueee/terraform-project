<style>
/* ==========================================================================
   NIFTY Option Strategy Suite — stylesheet
   Dark trading-terminal theme, mobile first.
   ========================================================================== */

:root {
  --bg:            #0a1017;
  --bg-elev:       #111a24;
  --bg-elev-2:     #16222e;
  --line:          #223141;
  --line-soft:     #1a2734;
  --text:          #e6edf3;
  --text-dim:      #93a4b5;
  --text-faint:    #6b7d8f;

  --accent:        #37d6a0;
  --accent-dark:   #1f9d73;
  --call:          #37d6a0;
  --put:           #ff6b81;
  --warn:          #ffb454;
  --danger:        #ff5f6d;
  --info:          #58a6ff;

  --radius:        14px;
  --radius-sm:     9px;
  --shadow:        0 10px 30px rgba(0, 0, 0, .35);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

/* An author `display` rule outranks the UA stylesheet's [hidden]{display:none},
   so anything given display:flex/grid would still paint while hidden. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 520px at 12% -8%, #14283a 0%, transparent 60%),
    radial-gradient(900px 480px at 92% 0%, #172a24 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }

h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }

.muted { color: var(--text-dim); }
.small { font-size: 13px; }
em { font-style: normal; color: var(--text-faint); font-weight: 400; }

/* ---------- header ---------- */
.app-header {
  border-bottom: 1px solid var(--line-soft);
  background: rgba(10, 16, 23, .82);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 30;
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark { display: flex; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text strong { font-size: 16px; letter-spacing: -.015em; }
.brand-text small { color: var(--text-faint); font-size: 12px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
  font: inherit; font-weight: 600; font-size: 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--line);
  padding: 9px 16px; cursor: pointer;
  background: var(--bg-elev-2); color: var(--text);
  transition: background .15s ease, border-color .15s ease, transform .05s ease;
}
.btn:hover { background: #1d2c3a; border-color: #2e4155; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.btn-primary {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
  border-color: transparent; color: #06231a;
}
.btn-primary:hover { filter: brightness(1.07); background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.lang-toggle { min-width: 74px; border-color: #2e4155; }

/* ---------- settings drawer ---------- */
.drawer {
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg-elev);
  padding: 20px 0 24px;
}
.drawer-title { font-size: 17px; margin-bottom: 6px; }
.settings-grid {
  display: grid; gap: 14px; margin: 16px 0 4px;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
}
.settings-group {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px 14px; margin: 0; background: var(--bg-elev-2);
}
.settings-group legend { padding: 0 6px; font-size: 13px; font-weight: 650; color: var(--accent); }
.settings-group .field { margin-bottom: 10px; }
.settings-group .field:last-child { margin-bottom: 0; }
.save-flash { color: var(--accent); font-size: 13px; align-self: center; }

/* ---------- tabs ---------- */
.tabs { border-bottom: 1px solid var(--line-soft); background: rgba(10, 16, 23, .6); position: sticky; top: 57px; z-index: 20; }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs-inner::-webkit-scrollbar { display: none; }
.tab {
  font: inherit; font-weight: 600; font-size: 14px; white-space: nowrap;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--text-dim); padding: 12px 14px 10px; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
}
.tab:hover { color: var(--text); }
.tab.is-active { color: var(--text); border-bottom-color: var(--accent); }
.tab-step { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
.tab.is-active .tab-step { color: var(--accent); }

/* ---------- layout ---------- */
main { padding: 22px 16px 44px; }
.panel { display: none; }
.panel.is-active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-head { margin-bottom: 14px; }
.card-head h2 { font-size: 16px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.card-head h3 { font-size: 15px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.card-head p { margin-top: 5px; font-size: 13px; }

.step-pill {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  background: #1c3b32; color: var(--accent);
  border-radius: 999px; padding: 3px 9px;
}

/* ---------- fields ---------- */
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12.5px; color: var(--text-dim); font-weight: 550; }
.field input, .field select {
  font: inherit; font-family: var(--mono); font-size: 15px;
  background: #0c141d; color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; width: 100%;
}
.field select { font-family: var(--sans); font-size: 13.5px; }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(55, 214, 160, .14); }
.field input::placeholder { color: #405366; }
.field input.is-invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255, 95, 109, .13); }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.ohlc { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ohlc-3 { grid-template-columns: 1fr; }
@media (min-width: 620px) {
  .ohlc { grid-template-columns: repeat(4, 1fr); }
  .ohlc-3 { grid-template-columns: repeat(3, 1fr); }
}

.err { color: var(--danger); font-size: 12.5px; margin: 8px 0 0; min-height: 0; }
.err:empty { display: none; }

.row-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- ATM ---------- */
.atm-row { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: end; }
@media (min-width: 700px) { .atm-row { grid-template-columns: 260px 1fr; } }
.atm-result {
  border: 1px dashed var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; background: #0c141d; min-height: 56px;
  display: flex; align-items: center;
}
.atm-strike { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); }
.atm-legs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.leg { font-family: var(--mono); font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
.leg-call { color: var(--call); border-color: rgba(55, 214, 160, .4); }
.leg-put  { color: var(--put);  border-color: rgba(255, 107, 129, .4); }

/* ---------- candle input boxes ---------- */
.candle-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .candle-grid { grid-template-columns: 1fr 1fr; } }
.candle-box {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px 14px; margin: 0; background: var(--bg-elev-2);
}
.candle-box legend { font-size: 13px; font-weight: 650; padding: 0 6px; display: flex; align-items: center; gap: 7px; }
.side-call legend { color: var(--call); }
.side-put  legend { color: var(--put); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-call { background: var(--call); }
.dot-put  { background: var(--put); }

/* ---------- analyser results ---------- */
.result-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .result-grid { grid-template-columns: 1fr 1fr; } }

.result-card { border-top: 3px solid var(--line); }
.result-card.side-call { border-top-color: var(--call); }
.result-card.side-put  { border-top-color: var(--put); }
.result-title { font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.result-title .badge-primary { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; background: #1c3b32; color: var(--accent); border-radius: 999px; padding: 3px 9px; }

.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.level {
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;
}
.level-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
.level-value { font-family: var(--mono); font-size: 19px; font-weight: 700; margin-top: 3px; }
.level-entry  .level-value { color: var(--info); }
.level-target .level-value { color: var(--accent); }
.level-sl     .level-value { color: var(--danger); }

.metrics { margin-top: 13px; display: grid; gap: 6px; }
.metric { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; border-bottom: 1px dashed var(--line-soft); padding-bottom: 5px; }
.metric:last-child { border-bottom: 0; }
.metric span:first-child { color: var(--text-dim); }
.metric span:last-child { font-family: var(--mono); }

.bar { height: 6px; border-radius: 999px; background: #0c141d; border: 1px solid var(--line); overflow: hidden; margin-top: 9px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-dark), var(--accent)); }
.bar-put > i { background: linear-gradient(90deg, #b8394c, var(--put)); }

.confirm-line {
  margin-top: 13px; font-size: 13px; background: #0c141d;
  border: 1px solid var(--line); border-left: 3px solid var(--info);
  border-radius: var(--radius-sm); padding: 9px 12px;
}
.confirm-line b { font-family: var(--mono); color: var(--info); }

.bias-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bias-tag { font-size: 13px; font-weight: 650; padding: 6px 13px; border-radius: 999px; }
.bias-call { background: rgba(55, 214, 160, .13); color: var(--call); }
.bias-put  { background: rgba(255, 107, 129, .13); color: var(--put); }
.bias-flat { background: rgba(147, 164, 181, .13); color: var(--text-dim); }

.note-card { border-left: 3px solid var(--info); }
.note-card h3 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.warn-card { border-left: 3px solid var(--warn); background: #1a1a12; }
.warn-card h3 { font-size: 15px; margin-bottom: 8px; color: var(--warn); }

/* ---------- T1 helper ---------- */
.t1-hero { text-align: center; padding: 26px 18px; }
.hero-badge {
  display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--warn);
  border: 1px solid rgba(255, 180, 84, .4); border-radius: 999px; padding: 5px 14px;
}
.t1-hero h2 { font-size: 24px; margin: 14px 0 8px; letter-spacing: -.02em; }
.t1-hero p { max-width: 560px; margin: 0 auto; font-size: 13.5px; }

.side-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.side-btn {
  font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--line); background: #0c141d; color: var(--text-dim);
  padding: 15px 12px; border-radius: var(--radius-sm); cursor: pointer;
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.side-btn:hover { color: var(--text); border-color: #33475c; }
.side-btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.side-btn[data-side="call"].is-active {
  color: var(--call); border-color: rgba(55, 214, 160, .55); background: rgba(55, 214, 160, .08);
  box-shadow: 0 0 0 1px rgba(55, 214, 160, .25), 0 0 22px rgba(55, 214, 160, .12);
}
.side-btn[data-side="put"].is-active {
  color: var(--put); border-color: rgba(255, 107, 129, .55); background: rgba(255, 107, 129, .08);
  box-shadow: 0 0 0 1px rgba(255, 107, 129, .25), 0 0 22px rgba(255, 107, 129, .12);
}

.btn-decide { width: 100%; padding: 15px 20px; font-size: 15.5px; letter-spacing: .02em; }
@media (min-width: 620px) { .btn-decide { width: auto; } }

/* candle preview */
.candle-preview {
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  margin-top: 16px; padding: 14px 16px;
  background: #0c141d; border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.candle-svg { flex: none; overflow: visible; }
.candle-facts { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.candle-stat { display: flex; flex-direction: column; gap: 2px; }
.candle-stat span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
.candle-stat b { font-family: var(--mono); font-size: 15px; }
.candle-dir { font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
.candle-dir.is-bull { color: var(--call); }
.candle-dir.is-bear { color: var(--put); }

/* signal strength */
.signal { display: grid; gap: 16px; }
.signal-num { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; margin-bottom: 7px; }
.signal-num span { color: var(--text-dim); }
.signal-num b { font-family: var(--mono); }

/* action plan */
.action-plan { margin: 0; padding-left: 22px; display: grid; gap: 10px; font-size: 14px; }
.action-plan li { padding-left: 4px; }
.action-plan li::marker { color: var(--accent); font-weight: 700; font-family: var(--mono); }

.mapping-note { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 14px; }
.map-item b { color: var(--text); font-weight: 650; }
.map-arrow { color: var(--text-faint); }

.verdict-card { text-align: center; padding: 24px 18px; }
.verdict-badge { display: inline-block; font-size: 22px; font-weight: 750; letter-spacing: -.01em; padding: 12px 26px; border-radius: var(--radius); }
.v-hold    { background: rgba(55, 214, 160, .13); color: var(--accent); border: 1px solid rgba(55, 214, 160, .35); }
.v-partial { background: rgba(255, 180, 84, .12); color: var(--warn);   border: 1px solid rgba(255, 180, 84, .35); }
.v-book    { background: rgba(255, 95, 109, .12);  color: var(--danger); border: 1px solid rgba(255, 95, 109, .35); }
.v-wait    { background: rgba(88, 166, 255, .10);  color: var(--info);   border: 1px solid rgba(88, 166, 255, .35); }
.verdict-sub { margin-top: 12px; font-size: 14px; color: var(--text-dim); max-width: 620px; margin-left: auto; margin-right: auto; }
.score-wrap { max-width: 380px; margin: 18px auto 0; }
.score-num { font-family: var(--mono); font-size: 15px; display: flex; justify-content: space-between; color: var(--text-dim); }
.score-num b { color: var(--text); }

.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.check {
  display: flex; gap: 11px; align-items: flex-start;
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 11px 13px;
}
.check.is-critical { border-color: rgba(88, 166, 255, .45); box-shadow: inset 3px 0 0 var(--info); }
.check-icon { font-family: var(--mono); font-weight: 700; font-size: 15px; line-height: 1.45; }
.check.pass .check-icon { color: var(--accent); }
.check.warn .check-icon { color: var(--warn); }
.check.fail .check-icon { color: var(--danger); }
.check-body { min-width: 0; flex: 1; display: block; }
.check-name { display: block; font-size: 13.5px; font-weight: 650; }
.check-name .crit-tag { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; background: rgba(88,166,255,.16); color: var(--info); border-radius: 999px; padding: 2px 8px; margin-left: 8px; vertical-align: 1px; }
.check-detail { display: block; font-size: 12.5px; color: var(--text-dim); font-family: var(--mono); margin-top: 3px; }
.check-verdict { flex: none; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; align-self: center; }
.check.pass .check-verdict { color: var(--accent); }
.check.warn .check-verdict { color: var(--warn); }
.check.fail .check-verdict { color: var(--danger); }

.gate { text-align: center; padding: 20px 18px; border-left: 3px solid var(--line); }
.gate.pass { border-left-color: var(--accent); }
.gate.fail { border-left-color: var(--danger); }
.gate h3 { font-size: 17px; margin-bottom: 6px; }
.gate.pass h3 { color: var(--accent); }
.gate.fail h3 { color: var(--danger); }

/* ---------- pullback ---------- */
.pb-side { font-size: 26px; font-weight: 750; letter-spacing: -.02em; padding: 14px 30px; border-radius: var(--radius); display: inline-block; }
.pb-call { background: rgba(55, 214, 160, .13); color: var(--call); border: 1px solid rgba(55, 214, 160, .35); }
.pb-put  { background: rgba(255, 107, 129, .12); color: var(--put); border: 1px solid rgba(255, 107, 129, .35); }
.zone-grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .zone-grid { grid-template-columns: repeat(3, 1fr); } }
.zone {
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 13px; text-align: center;
}
.zone-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--text-faint); }
.zone-value { font-family: var(--mono); font-size: 21px; font-weight: 700; margin-top: 3px; }
.zone-note { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
.zone-1 .zone-value { color: var(--info); }
.zone-2 .zone-value { color: var(--text-dim); }
.zone-t .zone-value { color: var(--accent); }
.no-sl { margin-top: 14px; text-align: center; font-size: 13px; color: var(--warn); font-weight: 650; }

.compare { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare th, .compare td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); font-family: var(--mono); }
.compare th:first-child, .compare td:first-child { text-align: left; font-family: var(--sans); color: var(--text-dim); }
.compare thead th { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-family: var(--sans); }
.compare .win { color: var(--accent); font-weight: 700; }
.table-scroll { overflow-x: auto; }

/* ---------- guide ---------- */
.guide .phase { font-size: 14px; color: var(--accent); margin: 22px 0 8px; letter-spacing: .01em; }
.guide .phase:first-child { margin-top: 0; }
.sop { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.sop li b { font-weight: 650; }
.sop li i { color: var(--info); font-style: normal; }
.inline-warn { color: var(--warn); font-weight: 650; }
.formula-list { display: grid; gap: 10px; margin-top: 12px; }
.formula {
  background: #0c141d; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 13px;
}
.formula h4 { font-size: 13px; margin: 0 0 6px; font-weight: 650; }
.formula code { font-family: var(--mono); font-size: 12.5px; color: var(--accent); display: block; white-space: pre-wrap; word-break: break-word; }
.formula p { font-size: 12.5px; color: var(--text-dim); margin: 6px 0 0; }

/* ---------- footer ---------- */
.app-footer { border-top: 1px solid var(--line-soft); padding: 20px 0 34px; font-size: 12.5px; color: var(--text-dim); }
.app-footer strong { color: var(--warn); }

@media (max-width: 700px) {
  /* the header wraps to two rows here, so stacked sticky bars would overlap */
  .app-header, .tabs { position: static; }
}

@media (max-width: 560px) {
  .levels { grid-template-columns: 1fr; }
  .verdict-badge { font-size: 18px; padding: 11px 18px; }
  .pb-side { font-size: 21px; padding: 12px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- trade signal ---------- */
.tile-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) { .tile-grid { grid-template-columns: repeat(4, 1fr); } }
.metric-tile {
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 14px 12px; text-align: center;
}
.tile-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--text-faint); }
.tile-value { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 4px; }
.tile-primary { border-color: rgba(88, 166, 255, .4); }
.tile-primary .tile-value { color: var(--info); }
.tile-good .tile-value { color: var(--accent); }
.tile-bad .tile-value { color: var(--danger); }

.edge-note { margin-top: 14px; font-size: 13.5px; text-align: center; font-weight: 600; }
.edge-note.is-good { color: var(--accent); }
.edge-note.is-bad { color: var(--danger); }

.check.skip { opacity: .62; }
.check.skip .check-icon { color: var(--text-faint); }
.check.skip .check-verdict { color: var(--text-faint); }
.weight-tag {
  font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  background: #16222e; color: var(--text-faint);
  border-radius: 999px; padding: 2px 7px; margin-left: 8px; vertical-align: 1px;
}

.metrics-table td:first-child { white-space: normal; }
.metrics-table td:last-child { text-align: right; white-space: nowrap; }
.metrics-table .pos { color: var(--accent); font-weight: 700; }
.metrics-table .neg { color: var(--danger); font-weight: 700; }

/* ---------- alerts ---------- */
.perm {
  font-size: 13px; border-radius: var(--radius-sm);
  padding: 10px 13px; border: 1px solid var(--line); background: #0c141d;
  border-left-width: 3px;
}
.perm-granted { border-left-color: var(--accent); color: var(--accent); }
.perm-default { border-left-color: var(--info); color: var(--text-dim); }
.perm-denied, .perm-unsupported { border-left-color: var(--warn); color: var(--warn); }

.checkline { display: flex; align-items: center; gap: 9px; font-size: 13.5px; margin-top: 14px; color: var(--text-dim); cursor: pointer; }
.checkline input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }

.reminder-row { display: grid; gap: 12px; margin-top: 16px; align-items: end; grid-template-columns: 1fr; }
@media (min-width: 620px) { .reminder-row { grid-template-columns: 260px 1fr; } }
.reminder-row .row-actions { margin-top: 0; }

.log-title { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); margin: 22px 0 10px; }
.alert-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.log-item {
  display: flex; gap: 12px; align-items: flex-start; font-size: 13px;
  background: #0c141d; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.log-time { font-family: var(--mono); color: var(--info); flex: none; }
.log-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.log-body span { color: var(--text-dim); font-family: var(--mono); font-size: 12.5px; }
.log-empty { padding: 10px 2px; }

/* ---------- auto-fetch ---------- */
.af-card { border-left: 3px solid var(--info); }
.af-row { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: end; }
@media (min-width: 820px) { .af-row { grid-template-columns: 230px 205px 1fr; } }
.af-row .row-actions { margin-top: 0; }

/* Symbol picker: free text with a datalist behind it, so any NSE F&O
   underlying can be typed even after an index reconstitution. */
.field-symbol input {
  text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
}
.af-status {
  margin-top: 14px; font-size: 13px; padding: 10px 13px;
  border: 1px solid var(--line); border-left-width: 3px;
  border-radius: var(--radius-sm); background: #0c141d;
}
.af-idle  { border-left-color: var(--line); color: var(--text-dim); }
.af-busy  { border-left-color: var(--info); color: var(--info); }
.af-armed { border-left-color: var(--warn); color: var(--warn); }
.af-ok    { border-left-color: var(--accent); color: var(--accent); }
.af-err   { border-left-color: var(--danger); color: var(--danger); }
.af-note { margin-top: 12px; }
.af-note code {
  font-family: var(--mono); font-size: 12px;
  background: #0c141d; border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 5px; color: var(--accent);
}

.ladder-reading {
  margin-top: 14px; padding: 11px 14px;
  background: #0c141d; border: 1px solid var(--line);
  border-left: 3px solid var(--info); border-radius: var(--radius-sm);
  display: flex; flex-direction: column; gap: 4px;
}
.ladder-reading b { font-family: var(--mono); font-size: 13.5px; color: var(--text); font-weight: 700; }
.ladder-reading span { font-size: 12.5px; color: var(--text-dim); }

/* ---------- analyser: verdict, targets, conditions ---------- */
.field.is-fixed input { border-color: rgba(255, 180, 84, .55); color: var(--warn); background: #161206; }
.field.is-fixed > span { color: var(--warn); }
.field.is-fixed em { color: rgba(255, 180, 84, .7); }

.an-verdict { text-align: left; padding: 20px 18px; }
.an-verdict.is-yes { border: 1px solid rgba(55, 214, 160, .45); }
.an-verdict.is-no  { border: 1px solid rgba(255, 180, 84, .45); }
.an-verdict-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.an-verdict .verdict-badge { font-size: 19px; padding: 10px 20px; }
.v-put { background: rgba(255, 107, 129, .12); color: var(--put); border: 1px solid rgba(255, 107, 129, .35); }
.an-confidence { display: flex; flex-direction: column; align-items: flex-end; }
.an-confidence b { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--accent); }
.an-confidence span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); font-weight: 700; }
.an-verdict .verdict-sub { margin: 14px 0 0; text-align: left; max-width: none; }

.entry-strip {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-top: 16px; padding: 13px 16px;
  background: #12100a; border: 1px solid rgba(255, 180, 84, .35);
  border-radius: var(--radius-sm);
}
.entry-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--text-faint); }
.entry-value { font-family: var(--mono); font-size: 25px; font-weight: 700; color: var(--warn); }
.entry-side { margin-left: auto; font-size: 13px; font-weight: 700; letter-spacing: .05em; padding: 6px 14px; border-radius: 999px; }
.entry-side.is-call { background: rgba(55, 214, 160, .14); color: var(--call); }
.entry-side.is-put  { background: rgba(255, 107, 129, .14); color: var(--put); }

.check.info { opacity: .68; }
.check.info .check-icon, .check.info .check-verdict { color: var(--text-faint); }
.check.warn .check-verdict { color: var(--warn); }

.target-card { padding: 0; overflow: hidden; border-top: 3px solid var(--line); }
.target-card.side-call { border-top-color: var(--call); }
.target-card.side-put  { border-top-color: var(--put); }
.target-card.is-chosen { box-shadow: 0 0 0 1px rgba(55, 214, 160, .3), var(--shadow); }
.target-title {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  font-size: 13px; letter-spacing: .09em; text-transform: uppercase;
  padding: 14px 16px; margin: 0; border-bottom: 1px solid var(--line-soft);
}
.side-call .target-title { color: var(--call); background: rgba(55, 214, 160, .05); }
.side-put  .target-title { color: var(--put);  background: rgba(255, 107, 129, .05); }
.target-title .badge-primary { margin-left: auto; }

.targets { width: 100%; border-collapse: collapse; font-size: 13px; }
.targets td { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.targets tr:last-child td { border-bottom: 0; }
.tgt-label { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; white-space: nowrap; }
.tgt-level { font-family: var(--mono); font-size: 18px; font-weight: 700; text-align: right; white-space: nowrap; }
.tgt-pts { font-family: var(--mono); font-size: 12px; color: var(--text-faint); text-align: right; white-space: nowrap; }
.tgt-action { text-align: right; }
.tgt-badge {
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
  border-radius: 6px; padding: 4px 9px; white-space: nowrap; border: 1px solid;
}
.row-entry .tgt-level { color: var(--warn); }
.row-t1 .tgt-level { color: var(--info); }
.row-t1 .tgt-badge { color: var(--info); border-color: rgba(88, 166, 255, .45); background: rgba(88, 166, 255, .1); }
.row-t2 .tgt-level { color: var(--accent); }
.row-t2 .tgt-badge { color: var(--info); border-color: rgba(88, 166, 255, .45); background: rgba(88, 166, 255, .1); }
.row-t3 .tgt-level { color: var(--text); }
.row-t3 .tgt-badge { color: var(--accent); border-color: rgba(55, 214, 160, .45); background: rgba(55, 214, 160, .1); }
.row-sl .tgt-level { color: var(--danger); }
.row-sl .tgt-badge { color: var(--danger); border-color: rgba(255, 95, 109, .45); background: rgba(255, 95, 109, .1); }

.zone.is-best { border-color: rgba(55, 214, 160, .5); box-shadow: inset 0 0 0 1px rgba(55, 214, 160, .18); }
.zone-3 .zone-value { color: var(--warn); }

/* ---------- pullback: concept + leg detail ---------- */
.concept-card { border-left: 3px solid var(--accent); }
.concept-card h3 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.concept-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 13.5px; }
.concept-list li { padding-left: 22px; position: relative; color: var(--text-dim); }
.concept-list li b { color: var(--text); }
.concept-list li::before { position: absolute; left: 0; font-family: var(--mono); font-weight: 700; }
.concept-list .is-bad::before  { content: '✕'; color: var(--danger); }
.concept-list .is-good::before { content: '✓'; color: var(--accent); }
.concept-list .is-key::before  { content: '★'; color: var(--warn); }

.pb-wait { background: rgba(255, 180, 84, .12); color: var(--warn); border: 1px solid rgba(255, 180, 84, .4); }

.leg-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .leg-grid { grid-template-columns: 1fr 1fr; } }
.leg-detail { background: #0c141d; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px 15px; }
.leg-detail.side-call { border-top: 2px solid var(--call); }
.leg-detail.side-put  { border-top: 2px solid var(--put); }
.leg-head { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 650; margin-bottom: 10px; }
.leg-badge { margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; border-radius: 999px; padding: 3px 10px; border: 1px solid; }
.leg-badge.is-good    { color: var(--accent); border-color: rgba(55, 214, 160, .45); background: rgba(55, 214, 160, .1); }
.leg-badge.is-doji    { color: var(--text-dim); border-color: var(--line); background: #16222e; }
.leg-badge.is-notrade { color: var(--danger); border-color: rgba(255, 95, 109, .45); background: rgba(255, 95, 109, .1); }
.leg-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 12.5px; font-family: var(--mono); }
.leg-checks li { display: flex; gap: 8px; color: var(--text-dim); }
.leg-checks li.pass > span { color: var(--accent); }
.leg-checks li.fail > span { color: var(--danger); }

/* ---------- scan ---------- */
.tf-box { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px 12px; margin: 0; background: #0c141d; }
.tf-box legend { padding: 0 6px; font-size: 12.5px; font-weight: 650; color: var(--accent); }
.tf-box .checkline { margin-top: 6px; }
.tf-box .checkline:first-of-type { margin-top: 2px; }

.agree-grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .agree-grid { grid-template-columns: 1fr 1fr; } }
.agree-card { background: #0c141d; border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--radius-sm); padding: 12px 14px; }
.agree-card.is-aligned { border-left-color: var(--accent); }
.agree-card.is-split   { border-left-color: var(--warn); }
.agree-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.agree-head b { font-family: var(--mono); font-size: 16px; }
.agree-tag { margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; border: 1px solid; }
.agree-tag.is-aligned { color: var(--accent); border-color: rgba(55, 214, 160, .45); background: rgba(55, 214, 160, .1); }
.agree-tag.is-split   { color: var(--warn);   border-color: rgba(255, 180, 84, .45); background: rgba(255, 180, 84, .1); }
.agree-tfs { display: flex; gap: 8px; flex-wrap: wrap; }
.agree-tf { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--text-dim); }
.agree-tf.is-with b { color: var(--accent); }
.agree-tf.is-against { border-color: rgba(255, 180, 84, .4); }
.agree-tf.is-against b { color: var(--warn); }

.scan-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.scan-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; padding: 8px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.scan-table td { padding: 9px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.scan-table td.num { font-family: var(--mono); text-align: right; }
.scan-table td.exp { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
.scan-table td.conf { font-weight: 700; }
.scan-table td.t { color: var(--accent); }
.scan-table td.sl { color: var(--danger); }
.scan-table tr.is-no td { opacity: .5; }
.scan-table tr.is-best td { background: rgba(55, 214, 160, .07); opacity: 1; }
.scan-side { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; border-radius: 5px; padding: 3px 8px; }
.scan-side.is-call { color: var(--call); background: rgba(55, 214, 160, .12); }
.scan-side.is-put  { color: var(--put);  background: rgba(255, 107, 129, .12); }
.best-tag { font-size: 10px; font-weight: 700; letter-spacing: .07em; color: var(--accent); border: 1px solid rgba(55, 214, 160, .45); border-radius: 999px; padding: 2px 8px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="#12202b"/><path d="M6 21l6-7 5 4 9-11" stroke="#37d6a0" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app.name">NIFTY Option Strategy Suite</strong>
        <small data-i18n="app.tagline">First-candle SOP · Analyser → T1 Helper → Pullback Entry</small>
      </span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-ghost lang-toggle" id="btn-lang" data-i18n="app.langSwitch">தமிழ்</button>
      <button type="button" class="btn btn-ghost" id="btn-settings" aria-expanded="false" aria-controls="settings-drawer" data-i18n="app.settings">Formula settings</button>
      <button type="button" class="btn btn-ghost" id="btn-clear-all" data-i18n="app.clearAll">Clear all</button>
    </div>
  </div>
</header>

<!-- ============ Formula settings drawer ============ -->
<section id="settings-drawer" class="drawer" hidden>
  <div class="wrap">
    <h2 class="drawer-title" data-i18n="cfg.title">Formula settings</h2>
    <p class="muted small" data-i18n="cfg.intro"></p>

    <div class="settings-grid">
      <fieldset class="settings-group">
        <legend data-i18n="cfg.g1">Option Analyser</legend>
        <label class="field"><span><span data-i18n="cfg.entryPremiumPct"></span> <em data-i18n="cfg.entryPremiumPct.hint"></em></span><input type="number" id="cfg-entryPremiumPct" step="0.05" min="0" max="20" /></label>
        <label class="field"><span><span data-i18n="cfg.targetStepMult"></span> <em data-i18n="cfg.targetStepMult.hint"></em></span><input type="number" id="cfg-targetStepMult" step="0.05" min="0.05" max="10" /></label>
        <label class="field"><span><span data-i18n="cfg.minTargetStep"></span> <em data-i18n="cfg.minTargetStep.hint"></em></span><input type="number" id="cfg-minTargetStep" step="1" min="0" max="500" /></label>
        <label class="field"><span data-i18n="cfg.t2Mult"></span><input type="number" id="cfg-t2Mult" step="0.1" min="0.1" max="20" /></label>
        <label class="field"><span data-i18n="cfg.t3Mult"></span><input type="number" id="cfg-t3Mult" step="0.1" min="0.1" max="20" /></label>
        <label class="field"><span><span data-i18n="cfg.slRangeMult"></span> <em data-i18n="cfg.slRangeMult.hint"></em></span><input type="number" id="cfg-slRangeMult" step="0.05" min="0" max="5" /></label>
        <label class="field"><span data-i18n="cfg.takeConfidence"></span><input type="number" id="cfg-takeConfidence" step="1" min="0" max="100" /></label>
        <label class="field"><span data-i18n="cfg.bookT1Pct"></span><input type="number" id="cfg-bookT1Pct" step="5" min="0" max="100" /></label>
        <label class="field"><span data-i18n="cfg.bookT2Pct"></span><input type="number" id="cfg-bookT2Pct" step="5" min="0" max="100" /></label>
        <label class="field"><span data-i18n="cfg.holdT3Pct"></span><input type="number" id="cfg-holdT3Pct" step="5" min="0" max="100" /></label>
      </fieldset>

      <fieldset class="settings-group">
        <legend data-i18n="cfg.g2">T1 Decision Helper</legend>
        <label class="field">
          <span><span data-i18n="cfg.bodyStrong"></span> <em data-i18n="cfg.bodyStrong.hint"></em></span>
          <input type="number" id="cfg-bodyStrong" step="0.05" min="0" max="1" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.bodyModerate"></span> <em data-i18n="cfg.bodyModerate.hint"></em></span>
          <input type="number" id="cfg-bodyModerate" step="0.05" min="0" max="1" />
        </label>
        <label class="field">
          <span><span data-i18n="cfg.minClosePos"></span> <em data-i18n="cfg.minClosePos.hint"></em></span>
          <input type="number" id="cfg-minClosePos" step="0.05" min="0" max="1" />
        </label>
        <label class="field">
          <span data-i18n="cfg.holdThreshold">Hold-T2 momentum threshold</span>
          <input type="number" id="cfg-holdThreshold" step="1" min="0" max="100" />
        </label>
        <label class="field">
          <span data-i18n="cfg.partialThreshold">Partial-book momentum threshold</span>
          <input type="number" id="cfg-partialThreshold" step="1" min="0" max="100" />
        </label>
        <label class="field">
          <span data-i18n="cfg.sideAwareDirection">Direction convention</span>
          <select id="cfg-sideAwareDirection">
            <option value="0" data-i18n="cfg.dir.premium"></option>
            <option value="1" data-i18n="cfg.dir.inverted"></option>
          </select>
        </label>
        <p class="muted small" style="margin-top:8px" data-i18n="cfg.dirNote"></p>
      </fieldset>

      <fieldset class="settings-group">
        <legend data-i18n="cfg.g4">Trade Signal — filters</legend>
        <label class="field"><span><span data-i18n="cfg.rsiMin"></span></span><input type="number" id="cfg-rsiMin" step="1" min="0" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.rsiMax"></span></span><input type="number" id="cfg-rsiMax" step="1" min="0" max="100" /></label>
        <label class="field"><span><span data-i18n="cfg.volumeMin"></span></span><input type="number" id="cfg-volumeMin" step="0.05" min="0" max="10" /></label>
        <label class="field"><span><span data-i18n="cfg.vixMax"></span></span><input type="number" id="cfg-vixMax" step="1" min="1" max="100" /></label>

<script>
/* Shared helpers. Attached to window.APP so the files load as plain scripts
   and the page also works when opened straight from disk. */
window.APP = window.APP || {};

(function (APP) {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* Parse an input value. Returns NaN for blank/garbage so callers can validate. */
  function num(value) {
    if (value === null || value === undefined) return NaN;
    var s = String(value).trim();
    if (s === '') return NaN;
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  function fmt(n, decimals) {
    if (!isFinite(n)) return '—';
    var d = decimals === undefined ? 2 : decimals;
    return n.toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  function pct(fraction, decimals) {
    if (!isFinite(fraction)) return '—';
    return fmt(fraction * 100, decimals === undefined ? 1 : decimals) + '%';
  }

  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

  /* Round to the nearest tick so displayed levels are actually placeable. */
  function toTick(value, tick) {
    if (!isFinite(value)) return NaN;
    var t = isFinite(tick) && tick > 0 ? tick : 0.05;
    return Math.round(value / t) * t;
  }

  /* Read an OHLC group whose inputs are `<prefix>-o|h|l|c`. */
  function readCandle(prefix) {
    return {
      o: num($(prefix + '-o').value),
      h: num($(prefix + '-h').value),
      l: num($(prefix + '-l').value),
      c: num($(prefix + '-c').value)
    };
  }

  function writeCandle(prefix, candle) {
    ['o', 'h', 'l', 'c'].forEach(function (k) {
      var el = $(prefix + '-' + k);
      if (el) el.value = isFinite(candle[k]) ? String(candle[k]) : '';
    });
  }

  function clearCandle(prefix) {
    ['o', 'h', 'l', 'c'].forEach(function (k) {
      var el = $(prefix + '-' + k);
      if (el) { el.value = ''; el.classList.remove('is-invalid'); }
    });
  }

  /* Validate a candle. Returns [] when usable, otherwise a list of messages.
     Also flags the offending inputs when a prefix is supplied. */
  function validateCandle(candle, label, prefix) {
    var t = window.APP.i18n.t;
    var errors = [];
    var bad = {};
    var fieldKeys = { o: 'f.open', h: 'f.high', l: 'f.low', c: 'f.close' };

    Object.keys(fieldKeys).forEach(function (k) {
      var field = t(fieldKeys[k]);
      if (!isFinite(candle[k])) { errors.push(t('v.required', { label: label, field: field })); bad[k] = true; }
      else if (candle[k] <= 0) { errors.push(t('v.positive', { label: label, field: field })); bad[k] = true; }
    });

    if (!errors.length) {
      if (candle.h < candle.l) {
        errors.push(t('v.highLow', { label: label }));
        bad.h = bad.l = true;
      }
      if (candle.h < Math.max(candle.o, candle.c)) {
        errors.push(t('v.highMax', { label: label }));
        bad.h = true;
      }
      if (candle.l > Math.min(candle.o, candle.c)) {
        errors.push(t('v.lowMin', { label: label }));
        bad.l = true;
      }
      if (candle.h === candle.l) {
        errors.push(t('v.noRange', { label: label }));
        bad.h = bad.l = true;
      }
    }

    if (prefix) {
      ['o', 'h', 'l', 'c'].forEach(function (k) {
        var el = $(prefix + '-' + k);
        if (el) el.classList.toggle('is-invalid', !!bad[k]);
      });
    }
    return errors;
  }

  function showErrors(elId, errors) {
    var el = $(elId);
    if (!el) return;
    el.textContent = errors && errors.length ? errors.join(' ') : '';
  }

  /* Descriptive stats shared by all three tools. */
  function candleStats(candle) {
    var range = candle.h - candle.l;
    var body = Math.abs(candle.c - candle.o);
    return {
      range: range,
      body: body,
      bodyRatio: range > 0 ? body / range : 0,
      closePos: range > 0 ? (candle.c - candle.l) / range : 0.5,
      upperWick: range > 0 ? (candle.h - candle.c) / range : 0,
      lowerWick: range > 0 ? (candle.c - candle.l) / range : 0,
      bullish: candle.c > candle.o,
      mid: (candle.h + candle.l) / 2,
      pivot: (candle.h + candle.l + candle.c) / 3
    };
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  APP.util = {
    $: $, $$: $$, num: num, fmt: fmt, pct: pct, clamp: clamp, toTick: toTick,
    readCandle: readCandle, writeCandle: writeCandle, clearCandle: clearCandle,
    validateCandle: validateCandle, showErrors: showErrors,
    candleStats: candleStats, escapeHtml: escapeHtml
  };
})(window.APP);
</script>

      /* guide */
      'g.title': 'Execution guide',
      'g.desc': 'The 13-step standard operating procedure this suite implements, phase by phase.',
      'g.p1': 'Phase 1 · ATM selection & option data setup',
      'g.p1s1': '<b>Identify the ATM strike.</b> Open the NIFTY chart, note the open of the first 5-minute candle (09:15–09:20) and round it down to the 100 strike. Open 23670 → 23600 CE and 23600 PE.',
      'g.p1s2': '<b>Record option OHLC.</b> In your broker app, note the open, high, low and close of that same 09:15–09:20 candle for both the ATM Call and the ATM Put.',
      'g.p2': 'Phase 2 · Option Analyser (levels & confirmation)',
      'g.p2s3': '<b>Enter values.</b> Put the CE OHLC into the Call section and the PE OHLC into the Put section, then press <i>Analyse</i>.',
      'g.p2s4': '<b>Read the output.</b> Three levels are produced for each side: entry price, Target 1 and stop loss.',
      'g.p2s5': '<b>Wait for confirmation.</b> Never enter on touch. Wait for a 5-minute candle to <i>close above</i> the entry price — entry 150 means a close of 150.05 or higher confirms it.',
      'g.p3': 'Phase 3 · T1 Decision Helper (target validation)',
      'g.p3s6': '<b>Select the trade side</b> — call trade or put trade.',
      'g.p3s7': '<b>Map the levels.</b> Entry field ← analyser stop loss · T1 level ← analyser entry price · T2 level ← analyser Target 1.',
      'g.p3s8': '<b>Enter the T1-touch candle</b> — the OHLC of the exact candle that reached the T1 level, once it has closed.',
      'g.p3s9': '<b>Decide.</b> <i>Hold → T2</i> means the probability of reaching target is high and the trade can be held. <i>Book now / partial book</i> means probability is low — exit or avoid.',
      'g.p3s10': '<b>Check condition 4.</b> Passed → proceed with the trade. Not passed → skip the trade, whatever the other checks say.',
      'g.p4': 'Phase 4 · Stoploss Pullback Entry (liquidity setup)',
      'g.p4s11': '<b>Enter the original first-candle data</b> for both Call and Put.',
      'g.p4s12': '<b>Check direction.</b> The tool returns Call Buy or Put Buy — trade only the recommended side.',
      'g.p4s13': '<b>Execute.</b> Zone 1 is the entry price, Target 1 is the target. <span class="inline-warn">No stop loss is used with this tool.</span>',
      'g.p5': 'Phase 5 · Trade Signal (confluence, edge & alerts)',
      'g.p5s14': '<b>Bring the levels across</b> and read the market-standard filters off the NIFTY chart — VWAP, EMA 20/50, RSI, volume against average, India VIX and the clock. Anything you cannot read is skipped, not guessed.',
      'g.p5s15': '<b>Check the edge before the size.</b> The win estimate is your own base rate moved by confluence; the breakeven win rate beside it is exact arithmetic. Take the trade only when the estimate clears breakeven and expected value is positive.',
      'g.p5s16': '<b>Turn on alerts.</b> The signal can fire a browser notification with the win estimate, expected profit and expected value, and a reminder can repeat on every 5-minute candle close while the page stays open.',
      'g.f5': 'Trade Signal — confluence, edge and expectancy',
      'g.f5n': 'Skipped filters are excluded from both sides of the ratio, so a partial reading is scored fairly rather than punished. Expected value and the breakeven win rate are ordinary arithmetic; only the win estimate is a judgement call, and it moves around the base rate you supply.',
      'g.formulas': 'How each number is calculated',
      'g.formulasDesc': 'The strategy guide specifies which levels each tool outputs, not the arithmetic. This suite uses the transparent first-candle range model below; every coefficient is editable under Formula settings.',
      'g.f1': 'Option Analyser — entry, three targets, stop loss',
      'g.f1n': 'Reproduces the original tool exactly — all twenty values across the four reference legs. The close drives the entry, which is why the original marks that field as fixed; the step is a fraction of the first-candle range with a points floor, and the three targets are multiples of it.',
      'g.f2': 'Option Analyser — side choice and confidence',
      'g.f2n': 'Direction, body and close position decide which leg to buy and how confidently. The 24400 put leg scores 20 + 40×0.75 + 40×0.75 = 80%, matching the original.',
      'g.f3': 'T1 Decision Helper — momentum score and gate',
      'g.f3n': 'Check 4 sits outside the momentum score: it asks whether the breakout above T1 actually happened, and it is the pre-trade gate the guide requires at step 10.',
      'g.f4': 'Stoploss Pullback Entry — side and zones',
      'g.f4n': 'Entries sit inside the first-candle range rather than above it — the setup buys the pullback into liquidity, which is why no stop loss is placed.',

      'g.p1': 'Phase 1 · ATM selection & option data setup',
      'g.p1s1': '<b>ATM strike கண்டுபிடி.</b> NIFTY chart-ஐ திற, first 5-minute candle-ஓட (09:15–09:20) open-ஐ பாத்து கீழ 100 strike-க்கு round பண்ணு. Open 23670 → 23600 CE, 23600 PE.',

      'g.p2s3': '<b>Values enter பண்ணு.</b> CE OHLC-ஐ Call section-லயும், PE OHLC-ஐ Put section-லயும் போட்டு <i>Analyse</i> அழுத்து.',

      'al.noSignalBody': 'முதல்ல signal எடு, அப்புறம் notification-ஆ அனுப்பு.',
      'al.logTitle': 'Alert log',
      'al.logEmpty': 'இன்னும் alert இல்ல.',

      /* footer */
      'foot.warn': 'Educational tool மட்டும்தான்.',
      'foot.body': 'இது investment advice இல்ல, trade பண்ண சொல்ற recommendation-ம் இல்ல. Options-ல நஷ்டம் வர்ற risk அதிகம்; நீ type பண்ற value-ல இருந்து கணக்கு போட்டு வர்ற level-கள் மட்டும்தான் இது, இது நடக்கும்னு எந்த உத்தரவாதமும் இல்ல. Trade பண்றதுக்கு முன்னாடி ஒவ்வொரு number-ஐயும் உன் broker terminal-ல verify பண்ணு.',
      'foot.privacy': 'எல்லா input-ம் உன் browser-லயே இருக்கும் — எதுவும் upload ஆகாது, server-ல store ஆகாது.'
    }
  };

  function t(key, vars) {
    var table = STRINGS[lang] || STRINGS.en;
    var str = table[key];
    if (str === undefined) str = STRINGS.en[key];
    if (str === undefined) return key;
    if (!vars) return str;
    return str.replace(/\{(\w+)\}/g, function (match, name) {
      return vars[name] !== undefined ? vars[name] : match;
    });
  }

  /* Replace the text of every tagged node. data-i18n sets textContent,
     data-i18n-html sets innerHTML for strings that carry markup. */
  function apply(root) {
    var scope = root || document;
    Array.prototype.forEach.call(scope.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(scope.querySelectorAll('[data-i18n-html]'), function (el) {
      el.innerHTML = t(el.getAttribute('data-i18n-html'));
    });
    document.documentElement.lang = lang === 'ta' ? 'ta' : 'en';
  }

  function set(next) {
    lang = next === 'ta' ? 'ta' : 'en';
    try { window.localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* ignore */ }
    apply();
    listeners.forEach(function (fn) { fn(lang); });
  }

  function init() {
    try {
      var stored = window.localStorage.getItem(STORAGE_KEY);
      if (stored === 'ta' || stored === 'en') lang = stored;
    } catch (e) { /* ignore */ }
    apply();
  }

  APP.i18n = {
    t: t,
    apply: apply,
    set: set,
    init: init,
    get: function () { return lang; },
    onChange: function (fn) { listeners.push(fn); }
  };
})(window.APP);
</script>
<script>
/* Tunable model coefficients + browser persistence.

   The strategy guide fixes *what* each tool outputs (entry / T1 / stop loss,
   hold-vs-book, buy side / zone 1 / target 1) but not the arithmetic. Every
   number that drives those outputs lives here so it can be re-tuned without
   touching the tools themselves. */
(function (APP) {
  'use strict';

  /* Bumped when the defaults themselves change: settings saved against an
     older model would otherwise keep overriding the corrected values, and the
     app would silently disagree with the original tool. */
  var STORAGE_KEY = 'nifty-option-suite:v2';

  var DEFAULTS = {
    /* Option Analyser — reproduces the original tool exactly across all four
       reference legs (entry, three targets and stop loss, 20 values). */
    entryPremiumPct: 0.5,   // entry = close + 0.5%
    targetStepMult: 0.8,    // one target step = 0.8 x first-candle range
    minTargetStep: 16,      // ...but never less than this many points
    t2Mult: 2.0,            // Target 2 = entry + 2.0 steps
    t3Mult: 3.5,            // Target 3 = entry + 3.5 steps
    slRangeMult: 0.3,       // stop loss = low - 0.3 x range
    bookT1Pct: 40,          // position management shown against each target
    bookT2Pct: 40,
    holdT3Pct: 20,
    takeConfidence: 60,     // side confidence needed for a YES verdict
    tickSize: 0.05,         // exchange tick

    /* T1 Decision Helper.
       Momentum = direction 40 + body {strong 15, moderate 7.5, weak 0} + close 40,
       floored. Those weights reproduce the reference tool's published scores. */
    bodyStrong: 0.65,       // body / range at or above this is strong momentum
    bodyModerate: 0.45,     // between moderate and strong scores half credit
    minClosePos: 0.50,      // close must sit in the upper half of its range
    holdThreshold: 70,      // momentum at or above this => HOLD T2
    partialThreshold: 40,   // momentum at or above this => PARTIAL BOOK, below => BOOK NOW
    sideAwareDirection: 1,  // 1 = a put trade wants a falling candle, matching the original
                            // tool; 0 = rising premium counts as good on both sides, which is
                            // the truer reading when the candle is the option's own premium

    /* Stoploss Pullback Entry */
    pbZone1: 0.25,          // aggressive entry  = low + (fraction x range)
    pbZone2: 0.38,          // best / average entry
    pbZone3: 0.50,          // last chance
    pbSlPct: 5,             // stop loss = low less this %, to the nearest rupee
    pbT1Mult: 0.8,          // targets are (multiplier x range) above the zone 2 entry,
    pbT2Mult: 1.4,          // each rounded to the nearest 10 points
    pbT3Mult: 2.2,
    pbTargetRound: 10,
    pbStrongBody: 0.65,     // body / range for "institutional move, very strong"
    pbDojiBody: 0.10,       // below this the candle is a doji — no momentum, no trade
    pbMinClosePos: 0.50,    // close must finish above the midpoint

    /* Trade Signal — market-standard filter thresholds */
    rsiMin: 55,             // call wants RSI in [rsiMin, rsiMax]; put mirrors it
    rsiMax: 78,
    volumeMin: 1.2,         // breakout volume as a multiple of the average
    vixMax: 25,             // above this the levels understate the swings
    atrReachMax: 2.0,       // T2 distance as a multiple of the reference range
    minRR: 1.5,             // minimum risk:reward to T2
    takeThreshold: 65,      // confluence needed for a full-size TAKE TRADE

    /* Trade Signal — money and sizing */
    lotSize: 75,            // NIFTY contract size
    costPerLot: 50,         // round-trip brokerage and charges per lot
    baseWinRate: 50,        // your own historical win rate, the anchor
    winSensitivity: 0.6,    // how far confluence moves the estimate off that base
    winFloor: 15,           // the estimate never claims more certainty than this
    winCeiling: 85,
    riskPctOfAccount: 2     // risk budget per trade, for the sizing suggestion
  };

  var state = null;

  function load() {
    var stored = {};
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) stored = JSON.parse(raw) || {};
      /* clear anything left by an earlier model so it cannot shadow a default */
      window.localStorage.removeItem('nifty-option-suite:v1');
    } catch (e) {
      stored = {}; // private mode / disabled storage / corrupt value
    }
    state = {};
    Object.keys(DEFAULTS).forEach(function (k) {
      var v = Number(stored[k]);
      state[k] = isFinite(v) ? v : DEFAULTS[k];
    });
    return state;
  }

  function get() { return state || load(); }

  function save(patch) {
    var cfg = get();
    Object.keys(patch || {}).forEach(function (k) {
      if (!(k in DEFAULTS)) return;
      var v = Number(patch[k]);
      if (isFinite(v)) cfg[k] = v;
    });
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    } catch (e) { /* nothing persistable — keep the in-memory values */ }
    return cfg;
  }

  function reset() {
    state = null;
    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    return load();
  }

  APP.config = { DEFAULTS: DEFAULTS, get: get, save: save, reset: reset, load: load };
})(window.APP);
</script>
<script>
/* Tradable underlyings — the five F&O indices and the NIFTY 50 stocks.

   This list only fills the picker's suggestions. The field itself stays free
   text and the helper accepts any NSE F&O symbol, so an index reconstitution
   (which happens twice a year) makes the list stale, never wrong: type the new
   name and it works. Nothing here is used in any calculation. */
(function (APP) {
  'use strict';

  var INDICES = ['NIFTY', 'BANKNIFTY', 'FINNIFTY', 'MIDCPNIFTY', 'NIFTYNXT50'];

  /* NIFTY 50 constituents. Trading symbols, not company names — that is what
     NSE's option-chain endpoint keys on. */
  var STOCKS = [
    'ADANIENT', 'ADANIPORTS', 'APOLLOHOSP', 'ASIANPAINT', 'AXISBANK',
    'BAJAJ-AUTO', 'BAJAJFINSV', 'BAJFINANCE', 'BEL', 'BHARTIARTL',
    'CIPLA', 'COALINDIA', 'DRREDDY', 'EICHERMOT', 'ETERNAL',
    'GRASIM', 'HCLTECH', 'HDFCBANK', 'HDFCLIFE', 'HEROMOTOCO',
    'HINDALCO', 'HINDUNILVR', 'ICICIBANK', 'INDUSINDBK', 'INFY',
    'ITC', 'JIOFIN', 'JSWSTEEL', 'KOTAKBANK', 'LT',
    'M&M', 'MARUTI', 'NESTLEIND', 'NTPC', 'ONGC',
    'POWERGRID', 'RELIANCE', 'SBILIFE', 'SBIN', 'SHRIRAMFIN',
    'SUNPHARMA', 'TATACONSUM', 'TATAMOTORS', 'TATASTEEL', 'TCS',
    'TECHM', 'TITAN', 'TRENT', 'ULTRACEMCO', 'WIPRO'
  ];

  function isIndex(symbol) {
    return INDICES.indexOf(String(symbol || '').toUpperCase()) !== -1;
  }

  /* Same rule the helper applies, so the field cannot send something the
     server will only reject after a round trip. */
  function clean(raw) {
    return String(raw == null ? '' : raw).trim().toUpperCase().replace(/[^A-Z0-9&\-]/g, '');
  }

  /** Fills a <datalist> once; the input keeps accepting anything typed. */
  function fillDatalist(id) {
    var el = document.getElementById(id);
    if (!el || el.childElementCount) return;
    el.innerHTML =
      INDICES.map(function (s) { return '<option value="' + s + '"></option>'; }).join('') +
      STOCKS.map(function (s) { return '<option value="' + s + '"></option>'; }).join('');
  }

  /* Both symbol fields share one remembered value — picking RELIANCE on the
     Scan tab and then fetching on the Analyser tab should not silently go back
     to NIFTY. */
  var KEY = 'nifty-option-suite:symbol';

  function remembered() {
    try { return clean(window.localStorage.getItem(KEY)) || 'NIFTY'; }
    catch (e) { return 'NIFTY'; }
  }

  function remember(symbol) {
    try { window.localStorage.setItem(KEY, clean(symbol) || 'NIFTY'); } catch (e) { /* private mode */ }
  }

  APP.symbols = {
    INDICES: INDICES,
    STOCKS: STOCKS,
    all: function () { return INDICES.concat(STOCKS); },
    isIndex: isIndex,
    clean: clean,
    fillDatalist: fillDatalist,
    remembered: remembered,
    remember: remember
  };
})(window.APP);
</script>
<script>
/* Tool 1 — Options Analyser (Phases 1–2).

   Input : the 09:15–09:20 candle of the ATM call and the ATM put.
   Output: which side to buy and how confidently, the entry price, three
           targets with position management, the stop loss, the pre-entry
           condition checklist and the rules to follow.

   The level model reproduces the original tool exactly — all twenty values
   across the four reference legs (24300 CE/PE and 24400 CE/PE):

     entry = close × 1.005
     step  = max(0.8 × range, 16)
     T1 / T2 / T3 = entry + step × {1, 2, 3.5}
     stop  = low − 0.3 × range

   The close drives the entry, which is why the original marks that field
   "CLOSE ★ (FIXED)". */
(function (APP) {
  'use strict';

  var U = APP.util;
  function t(key, vars) { return APP.i18n.t(key, vars); }
  function money(n) { return '₹' + U.fmt(n); }

  /* toFixed, not Math.round: 121 × 1.005 is 121.60499… in binary floating
     point, and the original shows 121.60 — the same rounding JS gives here. */
  function round2(n) { return Number(n.toFixed(2)); }

  /* ---------- ATM strike ----------
     The guide's own example rounds 23670 down to 23600, so the strike is the
     100-multiple at or below the open, not the arithmetically nearest one. */
  function atmStrike(spotOpen, stepSize) {
    var step = stepSize || 100;
    if (!isFinite(spotOpen) || spotOpen <= 0) return NaN;
    return Math.floor(spotOpen / step) * step;
  }

  /* ---------- one leg ---------- */
  function analyseSide(candle, cfg) {
    var s = U.candleStats(candle);
    var range = s.range;

    var entry = round2(candle.c * (1 + cfg.entryPremiumPct / 100));
    var step = Math.max(cfg.targetStepMult * range, cfg.minTargetStep);
    var target1 = round2(entry + step);
    var target2 = round2(entry + cfg.t2Mult * step);
    var target3 = round2(entry + cfg.t3Mult * step);
    var stopLoss = round2(candle.l - cfg.slRangeMult * range);

    /* Confidence: direction 20, body 40, close position 40. Reproduces the
       original's 80% on the 24400 put leg (bullish, 75% body, 75% close). */
    var confidence = U.clamp(
      20 * (s.bullish ? 1 : 0) + 40 * s.bodyRatio + 40 * s.closePos, 0, 100
    );

    return {
      candle: candle,
      stats: s,
      range: range,
      step: step,
      entry: entry,
      target1: target1,
      target2: target2,
      target3: target3,
      stopLoss: stopLoss,
      risk: entry - stopLoss,
      confidence: confidence,
      targets: [
        { key: 't1', level: target1, action: 'book', pct: cfg.bookT1Pct },
        { key: 't2', level: target2, action: 'book', pct: cfg.bookT2Pct },
        { key: 't3', level: target3, action: 'hold', pct: cfg.holdT3Pct }
      ]
    };
  }

  /* ---------- both legs, and the call ---------- */
  function analyse(ceCandle, peCandle, cfg) {
    var ce = analyseSide(ceCandle, cfg);
    var pe = analyseSide(peCandle, cfg);

    var side = ce.confidence >= pe.confidence ? 'call' : 'put';
    var chosen = side === 'call' ? ce : pe;
    var pcr = ceCandle.c > 0 ? peCandle.c / ceCandle.c : NaN;
    var pcrBias = pcr >= 1.2 ? 'bearish' : (pcr <= 0.8 ? 'bullish' : 'neutral');

    return {
      ce: ce, pe: pe,
      side: side,
      chosen: chosen,
      confidence: chosen.confidence,
      verdict: chosen.confidence >= cfg.takeConfidence ? 'yes' : 'no',
      pcr: pcr,
      pcrBias: pcrBias,
      conditions: conditions(ce, pe, pcr, pcrBias, side)
    };
  }

  /* ---------- pre-entry condition checklist ---------- */
  function conditions(ce, pe, pcr, pcrBias, side) {
    var list = [];
    function add(name, state, detail) { list.push({ name: name, state: state, detail: detail }); }

    add(t('an.cond.closed'), U.$('an-closed').checked ? 'pass' : 'fail',
        t(U.$('an-closed').checked ? 'an.cond.closedYes' : 'an.cond.closedNo'));

    [['call', ce], ['put', pe]].forEach(function (pair) {
      var key = pair[0], leg = pair[1];
      var wanted = key === side;
      add(t('an.cond.direction', { side: t('f.' + key + 'Short') }),
          leg.stats.bullish ? 'pass' : (wanted ? 'fail' : 'info'),
          t(leg.stats.bullish ? 'an.cond.bullish' : 'an.cond.bearish',
            { o: U.fmt(leg.candle.o), c: U.fmt(leg.candle.c) }));
    });

    [['call', ce], ['put', pe]].forEach(function (pair) {
      var key = pair[0], leg = pair[1];
      add(t('an.cond.body', { side: t('f.' + key + 'Short') }),
          leg.stats.bodyRatio >= 0.6 ? 'pass' : (key === side ? 'fail' : 'info'),
          U.pct(leg.stats.bodyRatio));
    });

    [['call', ce], ['put', pe]].forEach(function (pair) {
      var key = pair[0], leg = pair[1];
      add(t('an.cond.closePos', { side: t('f.' + key + 'Short') }),
          leg.stats.closePos >= 0.6 ? 'pass' : (key === side ? 'fail' : 'info'),
          U.pct(leg.stats.closePos));
    });

    add(t('an.cond.pcr'), pcrBias === 'neutral' ? 'warn' : 'pass',
        U.fmt(pcr, 2) + ' — ' + t('an.pcr.' + pcrBias));

    return list;
  }

  /* ---------- rendering ---------- */
  var STATE_ICON = { pass: '✓', fail: '✕', warn: '⚠', info: '·' };

  function renderVerdict(r, cfg) {
    var isCall = r.side === 'call';
    var leg = r.chosen;
    var buyLabel = t(isCall ? 'an.buyCall' : 'an.buyPut');
    var yes = r.verdict === 'yes';

    U.$('an-verdict').className = 'card verdict-card an-verdict ' + (yes ? 'is-yes' : 'is-no');
    U.$('an-verdict').innerHTML = '' +
      '<div class="an-verdict-top">' +
        '<div class="verdict-badge ' + (isCall ? 'v-hold' : 'v-put') + '">' +
          (yes ? '✅ ' : '⚠ ') + U.escapeHtml(yes ? t('an.yes', { buy: buyLabel }) : t('an.noClear')) +
        '</div>' +
        '<div class="an-confidence"><b>' + U.fmt(r.confidence, 0) + '%</b>' +
          '<span>' + U.escapeHtml(t('an.confidence')) + '</span></div>' +
      '</div>' +
      '<p class="verdict-sub">' + U.escapeHtml(t('an.reason', {
        side: t(isCall ? 'f.call' : 'f.put'),
        dir: t(leg.stats.bullish ? 'an.cond.bullishWord' : 'an.cond.bearishWord'),
        body: U.pct(leg.stats.bodyRatio),
        close: U.pct(leg.stats.closePos),
        pcr: U.fmt(r.pcr, 2),
        pcrBias: t('an.pcr.' + r.pcrBias)
      })) + '</p>' +
      '<div class="entry-strip">' +
        '<span class="entry-label">' + U.escapeHtml(t('an.entryPrice')) + '</span>' +
        '<span class="entry-value">' + money(leg.entry) + '</span>' +
        '<span class="entry-side ' + (isCall ? 'is-call' : 'is-put') + '">' + U.escapeHtml(buyLabel) + '</span>' +
      '</div>';
  }

  function renderConditions(r) {
    U.$('an-conditions').innerHTML = r.conditions.map(function (c) {
      return '<li class="check ' + c.state + '">' +
        '<span class="check-icon" aria-hidden="true">' + STATE_ICON[c.state] + '</span>' +
        '<span class="check-body"><span class="check-name">' + U.escapeHtml(c.name) + '</span></span>' +
        '<span class="check-verdict">' + U.escapeHtml(c.detail) + '</span>' +
      '</li>';
    }).join('');
  }

  function targetTable(leg, isPut, isChosen) {
    function row(label, level, delta, badge, cls) {
      return '<tr class="' + cls + '">' +
        '<td class="tgt-label">' + U.escapeHtml(label) + '</td>' +
        '<td class="tgt-level">' + money(level) + '</td>' +
        '<td class="tgt-pts">' + (delta >= 0 ? '+' : '−') + U.fmt(Math.abs(delta), 0) + t('an.pts') + '</td>' +
        '<td class="tgt-action">' + (badge ? '<span class="tgt-badge ' + cls + '">' + U.escapeHtml(badge) + '</span>' : '') + '</td>' +
      '</tr>';
    }
    return '' +
      '<article class="card target-card ' + (isPut ? 'side-put' : 'side-call') + (isChosen ? ' is-chosen' : '') + '">' +
        '<h3 class="target-title"><span class="dot ' + (isPut ? 'dot-put' : 'dot-call') + '"></span>' +
          U.escapeHtml(t(isPut ? 'an.putTargets' : 'an.callTargets')) +
          (isChosen ? '<span class="badge-primary">' + U.escapeHtml(t('an.tradeThis')) + '</span>' : '') +
        '</h3>' +
        '<div class="table-scroll"><table class="targets"><tbody>' +
          row(t('an.entry'), leg.entry, 0, '', 'row-entry').replace('<td class="tgt-pts">+0' + t('an.pts') + '</td>', '<td class="tgt-pts"></td>') +
          row(t('an.target1'), leg.target1, leg.target1 - leg.entry, t('an.book', { pct: 40 }), 'row-t1') +
          row(t('an.target2'), leg.target2, leg.target2 - leg.entry, t('an.book', { pct: 40 }), 'row-t2') +
          row(t('an.target3'), leg.target3, leg.target3 - leg.entry, t('an.hold', { pct: 20 }), 'row-t3') +
          row(t('an.stopLoss'), leg.stopLoss, leg.stopLoss - leg.entry, t('an.exitAll'), 'row-sl') +
        '</tbody></table></div>' +
      '</article>';
  }

  function renderTargets(r) {
    U.$('an-targets').innerHTML =
      targetTable(r.ce, false, r.side === 'call') +
      targetTable(r.pe, true, r.side === 'put');
  }

  function renderRules(r) {
    var leg = r.chosen;
    var buy = t(r.side === 'call' ? 'an.buyCall' : 'an.buyPut');
    var vars = {
      buy: buy, entry: money(leg.entry), sl: money(leg.stopLoss),
      t1: money(leg.target1), t2: money(leg.target2), t3: money(leg.target3)
    };
    var rules = [1, 2, 3, 4, 5, 6].map(function (n) { return t('an.rule' + n, vars); });
    U.$('an-rules').innerHTML =
      '<div class="card-head"><h3>' + U.escapeHtml(t('an.rulesTitle')) + '</h3>' +
      '<p class="muted">' + U.escapeHtml(t('an.rulesDesc')) + '</p></div>' +
      '<ol class="action-plan">' +
        rules.map(function (x) { return '<li>' + U.escapeHtml(x) + '</li>'; }).join('') +
      '</ol>';
  }

  function render(result, cfg) {
    renderVerdict(result, cfg);
    renderConditions(result);
    renderTargets(result);
    renderRules(result);
    U.$('analyser-output').hidden = false;
  }

  function renderAtm() {
    var el = U.$('atm-result');
    var open = U.num(U.$('atm-open').value);
    if (!isFinite(open) || open <= 0) {
      el.innerHTML = '<span class="muted small">' + U.escapeHtml(t('an.atmHint')) + '</span>';
      return;
    }
    var strike = atmStrike(open);
    el.innerHTML = '' +
      '<div>' +
        '<div class="atm-strike">' + U.fmt(strike, 0) + '</div>' +
        '<div class="atm-legs">' +
          '<span class="leg leg-call">' + U.fmt(strike, 0) + ' CE</span>' +
          '<span class="leg leg-put">' + U.fmt(strike, 0) + ' PE</span>' +
        '</div>' +
        '<div class="muted small" style="margin-top:6px">' +
          U.escapeHtml(t('an.atmRounded', { open: U.fmt(open) })) + '</div>' +
      '</div>';
  }

  /* ---------- controller ---------- */
  function run() {
    var cfg = APP.config.get();
    var ce = U.readCandle('an-ce');
    var pe = U.readCandle('an-pe');

    var ceErrors = U.validateCandle(ce, t('v.call'), 'an-ce');
    var peErrors = U.validateCandle(pe, t('v.put'), 'an-pe');
    U.showErrors('an-ce-err', ceErrors);
    U.showErrors('an-pe-err', peErrors);

    if (ceErrors.length || peErrors.length) {
      U.$('analyser-output').hidden = true;
      APP.state.analyser = null;
      return null;
    }

    var result = analyse(ce, pe, cfg);
    APP.state.analyser = result;
    render(result, cfg);
    return result;
  }

  function reset() {
    U.clearCandle('an-ce');
    U.clearCandle('an-pe');
    U.$('atm-open').value = '';
    U.$('an-closed').checked = true;
    U.showErrors('an-ce-err', []);
    U.showErrors('an-pe-err', []);
    U.$('analyser-output').hidden = true;
    APP.state.analyser = null;
    renderAtm();
  }

  function loadSample() {
    U.$('atm-open').value = '24400';
    U.writeCandle('an-ce', { o: 143, h: 143, l: 110, c: 110 });
    U.writeCandle('an-pe', { o: 94, h: 130, l: 94, c: 121 });
    U.$('an-closed').checked = true;
    renderAtm();
    run();
  }

  function init() {
    U.$('btn-analyse').addEventListener('click', run);
    U.$('btn-analyser-reset').addEventListener('click', reset);
    U.$('btn-analyser-sample').addEventListener('click', loadSample);
    U.$('atm-open').addEventListener('input', renderAtm);
    U.$('an-closed').addEventListener('change', function () { if (APP.state.analyser) run(); });

    U.$$('#panel-analyser .candle-box input').forEach(function (input) {
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    });

    /* Hand-off buttons are rendered with the results, so delegate. */
    U.$('analyser-output').addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('[data-send-t1]');
      if (btn) APP.t1helper.importFromAnalyser(btn.getAttribute('data-send-t1'));
    });
  }

  APP.analyser = {
    init: init, run: run, reset: reset,
    analyse: analyse, analyseSide: analyseSide,
    atmStrike: atmStrike, renderAtm: renderAtm
  };
})(window.APP);
</script>
<script>
/* Auto-fill the first-candle values from the local NSE helper.

   The page cannot call nseindia.com itself — NSE sends no CORS headers and
   gates its APIs behind session cookies, so the browser blocks the request
   before it leaves the tab. tools/nse-fetch.js does the handshake on your
   machine and re-serves the candle on localhost; this module talks to that.

   Nothing here is required: if the helper is not running you get a clear
   message and type the four values in as before. */
(function (APP) {
  'use strict';

  var U = APP.util;
  function t(key, vars) { return APP.i18n.t(key, vars); }

  var STORAGE_KEY = 'nifty-option-suite:endpoint';
  var DEFAULT_ENDPOINT = 'http://127.0.0.1:8123';

  /* The window the user asked for: fire just after the 09:20 candle closes and
     keep retrying for a minute in case the feed lags. */
  var ARM_AT = { h: 9, m: 21, s: 5 };
  var RETRY_MS = 15000;
  var GIVE_UP = { h: 9, m: 22, s: 30 };

  var armTimer = null;
  var retryTimer = null;
  var lastPayload = null;

  function endpoint() {
    var el = U.$('af-endpoint');
    var value = (el && el.value || '').trim().replace(/\/+$/, '');
    return value || DEFAULT_ENDPOINT;
  }

  function saveEndpoint() {
    try { window.localStorage.setItem(STORAGE_KEY, endpoint()); } catch (e) { /* ignore */ }
  }

  function loadEndpoint() {
    var stored = null;
    try { stored = window.localStorage.getItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    U.$('af-endpoint').value = stored || DEFAULT_ENDPOINT;
  }

  function status(kind, message) {
    var el = U.$('af-status');
    el.className = 'af-status af-' + kind;
    el.textContent = message;
  }

  function clock(date) {
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
  }

  function atTime(spec, from) {
    var d = new Date(from);
    d.setHours(spec.h, spec.m, spec.s, 0);
    return d;
  }

  function symbol() {
    var el = U.$('af-symbol');
    return APP.symbols.clean(el && el.value) || 'NIFTY';
  }

  /* ---------- fetching ---------- */
  function request(fresh) {
    var url = endpoint() + '/first-candle?symbol=' + encodeURIComponent(symbol()) +
              (fresh ? '&fresh=1' : '');
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timeout = window.setTimeout(function () { if (controller) controller.abort(); }, 12000);

    return window.fetch(url, { signal: controller ? controller.signal : undefined })
      .then(function (res) {
        return res.json().then(function (body) {
          if (!res.ok) throw new Error(body && body.error ? body.error : 'HTTP ' + res.status);
          return body;
        });
      })
      .finally(function () { window.clearTimeout(timeout); });
  }

  function validPayload(p) {
    if (!p || !p.ce || !p.pe) return false;
    return ['o', 'h', 'l', 'c'].every(function (k) {
      return isFinite(p.ce[k]) && p.ce[k] > 0 && isFinite(p.pe[k]) && p.pe[k] > 0;
    });
  }

  function applyPayload(p) {
    U.writeCandle('an-ce', p.ce);
    U.writeCandle('an-pe', p.pe);
    if (isFinite(p.underlying)) {
      U.$('atm-open').value = String(p.underlying);
      APP.analyser.renderAtm();
    }
    /* Contract size belongs to the symbol, not to the user's preferences — a
       RELIANCE candle priced against NIFTY's 75 would be wrong everywhere the
       Trade Signal tab talks about money. */
    lastPayload = p;
    APP.analyser.run();
  }

  function applyLotSize(p) {
    var lot = Number(p && p.lotSize);
    if (!isFinite(lot) || lot <= 0 || lot === APP.config.get().lotSize) return null;
    APP.config.save({ lotSize: lot });
    return lot;
  }

  function fetchNow(fresh, quiet) {
    status('busy', t('af.fetching'));
    return request(fresh).then(function (p) {
      if (!validPayload(p)) throw new Error(t('af.badPayload'));
      applyPayload(p);
      var lot = applyLotSize(p);
      var msg = t('af.filled', {
        symbol: p.symbol || symbol(),
        atm: U.fmt(p.atm, 0),
        time: p.asOf || clock(new Date()),
        source: p.source === 'mock' ? t('af.mockSource') : p.source,
        ticks: (p.ce.ticks || 0) + (p.pe.ticks || 0)
      }) + (lot ? ' ' + t('sym.lotApplied', { lot: lot }) : '');
      /* Before the open, or on a holiday, NSE serves the previous session.
         That must never look like today's candle. */
      if (p.stale && p.session) {
        status('armed', msg + ' ' + t('af.staleSession', { session: p.session }));
      } else {
        status('ok', msg + (p.session ? ' ' + t('af.session', { session: p.session }) : ''));
      }
      return p;
    }).catch(function (err) {
      var msg = String(err && err.message || err);
      var offline = /Failed to fetch|NetworkError|abort/i.test(msg);
      status('err', offline
        ? t('af.helperOffline', { endpoint: endpoint() })
        : t('af.failed', { reason: msg }));
      if (!quiet) throw err;
      return null;
    });
  }

  /* ---------- the 09:21 schedule ---------- */
  function stopRetries() {
    if (retryTimer) { window.clearInterval(retryTimer); retryTimer = null; }
  }

  function runWindow() {
    stopRetries();
    var giveUp = atTime(GIVE_UP, new Date());

    var attempt = function () {
      if (Date.now() > giveUp.getTime()) {
        stopRetries();
        status('err', t('af.windowMissed'));
        disarm(true);
        return;
      }
      fetchNow(true, true).then(function (p) {
        if (p) { stopRetries(); disarm(true); }
      });
    };

    attempt();
